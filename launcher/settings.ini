[TOTK_VK_VARYING_DEFAULTS]
name = Console defaults for unwritten varyings
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Shader values a vertex shader never writes read (0, 0, 0, 1), as on the Switch. Fixes the Depths map not filling in after a lightroot.
detail = A few of TOTK's shaders read a value the vertex shader before them never writes; the Switch then gives (0, 0, 0, 1), while in Vulkan it is undefined. The map's reveal shaders are such: without this, the areas lit by a lightroot were not drawn on the map. The vertex shader gets a variant (made once, then kept) that writes those values. The log says "fragment inputs ... not written by the vertex shader ... given (0,0,0,1)", and a frame capture prints "varyings:" under such a draw.
tradeoff = None expected: one more small shader per such pair, made once. Off: as before 0341, for comparison only (the map stays dark).


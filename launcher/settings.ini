# Ultra Instinct Tears launcher: every setting the game reads from ultrainstincttears.cfg, in one table.
#
# One [section] per key, in the order the launcher shows them. The launcher (launcher/main.cpp) embeds this file at
# build time; tools/check_launcher_keys.py checks that every TOTK_* key the runtime reads (src/) is listed here.
#
# Fields
#   name      what the player sees
#   tab       graphics | performance | game | advanced
#   section   a collapsible section of the tab the setting's group sits in (Performance > Stutter)
#   group     heading the setting sits under; groups ending in "+" start folded (progressive disclosure)
#   type      bool | choice | int | float | text | pad (controller binding) | key (keyboard binding)
#   default   the value the game uses when the key is not in ultrainstincttears.cfg ("-" = the key absent)
#   on/off    bool: what is written for on and off ("-" = remove the line)
#   choices   choice: value:Label|value:Label ("-" = remove the line, i.e. the game's own default)
#   min max step unit    int/float range; auto = label of an extra first position that removes the line
#   zero      int/float: what 0 means, shown instead of "0"
#   hint      text: what a value looks like
#   summary   one line: what it does and when to change it
#   detail    the longer explanation in the detail panel
#   tradeoff  the cost of changing it
#   recommended   the value the "Recommended for this PC" preset writes (also shows the badge)
#   needs     KEY=v1,v2: dimmed with a note unless that key's value is one of these
#   alias     another name the runtime reads for the same thing (cfg path names)
#   restart   1 = a hotkey changes it in game as well (shown as a tip)
#   tip       short extra line under the detail (hotkeys etc.)
#   ask       1 = the launcher asks for it the first time it opens (UIT 0270); with default = - the key absent means
#             "not asked yet", and the launcher then uses the first choice
#   lift      quality | fxaa | lod | shadow | cheat_durability | cheat_amiibo: greyed out unless the build-time scan found that game code in this build
#             (data/generated/lift-features.ini, written by tools/lifter/scan.py; the reason is shown when it did not)
#   applies   when a change takes effect (UIT 0304): live = the in-game overlay changes it while the game runs;
#             setup = at the next setup run; launcher = the launcher's own; no line = restart (the game reads it when
#             it starts: the launcher tags it "restart"). tools/check_launcher_keys.py checks each one against the code.

# ---------------------------------------------------------------- Graphics

[TOTK_UPSCALER]
name = Upscaler
tab = graphics
group = Image quality
type = choice
applies = live
default = off
choices = off:Off|fsr:AMD FSR 1|dlss:NVIDIA DLSS
summary = How the game's picture is enlarged to fill your window or screen.
detail = The game renders at its own Switch resolution (about 1600x900 docked) and the picture is then enlarged to your screen. FSR 1 works on every GPU and sharpens edges as it enlarges. DLSS uses an NVIDIA RTX GPU's tensor cores to rebuild a cleaner, steadier 1080p image from the game's frames; FSR 1 then takes that to your screen. DLSS needs NVIDIA's Streamline DLLs (nvngx_dlss.dll and sl.*.dll) next to UltraInstinctTears.exe: tools/setup.py copies them from deps\streamline when you have the SDK. Without them, or on a GPU without DLSS, the game quietly uses FSR 1.
tradeoff = Both cost a little GPU time. DLSS gives the best image on RTX cards; FSR 1 is the safe choice everywhere. Off gives plain bilinear scaling (soft at 4K).
recommended = fsr
tip = In game, F8 turns FSR on and off and F10 turns DLSS on and off, to compare.

[TOTK_DLSS_MODE]
name = DLSS mode
tab = graphics
group = Image quality
type = choice
default = quality
choices = dlaa:DLAA (the game's own resolution)|quality:Quality|balanced:Balanced|performance:Performance|ultraperf:Ultra Performance
needs = TOTK_UPSCALER=dlss
summary = How hard DLSS works: DLAA for the cleanest image, Performance for the lightest load.
detail = DLAA keeps the game's own internal resolution and uses DLSS for anti-aliasing and scaling only. The game's own resolution grows with the Output resolution but stays below it (1600x900 at 1080p, 3200x1800 at 2160p), so DLSS still enlarges a little; for DLAA at the full Output resolution set Graphics > Image quality+ > Scene resolution to native (much more GPU time: at 2160p 44 % more pixels than 3200x1800). Quality, Balanced, Performance and Ultra Performance render the scene at 67%, 58%, 50% and 33% of the Output resolution and let DLSS rebuild the rest, which frees GPU time for higher frame rates. (UIT 0313: this choice was labelled "native" before.)
tradeoff = Lower modes are faster but softer and can shimmer on fine detail such as grass and hair.
recommended = quality

[TOTK_FSR]
name = FSR 1 switch (legacy)
tab = graphics
group = Image quality+
type = bool
applies = live
default = off
on = 1
off = 0
summary = The original on/off switch for FSR 1. The Upscaler setting above keeps it in step for you.
detail = Builds made before the Upscaler setting existed only read this key. When you pick an upscaler above, the launcher writes this key too so that older and newer builds agree. Change it here only if you know you need to.
tradeoff = Setting this against the Upscaler choice can leave the two disagreeing.
tip = In game, F8 toggles it.

[TOTK_DLSS_PRESET]
name = DLSS model
tab = graphics
group = Image quality+
type = choice
default = -
choices = -:Automatic|default:Driver's choice|j:Preset J|k:Preset K|l:Preset L|m:Preset M|n:Preset N|o:Preset O
needs = TOTK_UPSCALER=dlss
summary = Which DLSS neural network model to use. Automatic picks NVIDIA's recommendation for the mode.
detail = Automatic uses NVIDIA's recommended transformer models: preset K for DLAA, Quality and Balanced, M for Performance and L for Ultra Performance. Driver's choice leaves it to the NVIDIA driver (and the NVIDIA app's override). A letter forces that preset.
tradeoff = Older presets can be slightly faster but smear more in motion. Leave it on Automatic unless you are comparing.

[TOTK_RENDER_RES]
name = Scene resolution
tab = graphics
group = Image quality+
type = text
default = -
hint = native, or a size like 1280x720 (320x180 up to the output resolution); 0 = the game's own size
summary = Override the size the 3D scene is drawn at. Empty lets the DLSS mode decide.
detail = Normally the DLSS mode sets this (for example about 1280x720 for Quality at a 1080p output), and without DLSS the game keeps its own docked size (1600x900, or larger with a larger Output resolution). "native" draws the scene at the full Output resolution, so the game's own built-in upscale does nothing and only FSR 1 or DLSS (or nothing) runs: the sharpest picture. A size forces exactly that size, with or without DLSS; 0 keeps the game's own size even with DLSS. The game's video memory is grown to fit the size you choose here; a size it cannot hold is ignored and the log says so.
tradeoff = native and large sizes cost a lot of GPU time (native at 2160p is four times the work of 1080p). Fewer pixels run faster but look softer.

[TOTK_FSR_SHARPNESS]
name = Sharpening
tab = graphics
group = Image quality
type = float
applies = live
default = 0.25
min = 0
max = 2
step = 0.05
zero = Maximum
needs = TOTK_UPSCALER=fsr
summary = How strongly FSR sharpens. Lower numbers are sharper; raise it if edges look crunchy.
detail = This is FSR's RCAS sharpening strength, measured in stops: 0 is the strongest sharpening, 2 is nearly none. The default of 0.25 is crisp without halos at 4K.
tradeoff = Very low values can add halos and make foliage sparkle; high values look softer.
tip = In game, F9 steps through sharpness values.

[TOTK_OUTPUT_RES]
name = Output resolution (experimental)
tab = graphics
group = Resolution and shape
type = choice
default = -
choices = -:1920 x 1080 (game's own)|display:The display's size|1440p:2560 x 1440|2160p:3840 x 2160|2560x1080:2560 x 1080 (21:9)|3440x1440:3440 x 1440 (21:9)|3840x1600:3840 x 1600 (24:10)|5120x2160:5120 x 2160 (21:9)
summary = The game's own full-screen picture size: menus, text and the HUD are drawn this large. Needs a re-lift.
detail = The Switch version composes every frame on a 1920x1080 canvas, and the 3D scene is drawn smaller (1600x900) and enlarged onto it. This raises the canvas itself, so text, menus and the HUD are sharp at 1440p and 4K, and the scene grows with it (the game draws it at the same fraction of the canvas, or at your Scene resolution / DLSS size). The game's video-memory pools (the HeapDef file's texture heaps and the application memory pool) are enlarged to match automatically, in memory only; nothing on disk is changed. A wider-than-16:9 size also turns on the wider view (see Aspect ratio). It works together with FSR 1 and DLSS. The display's size: the main display's own resolution (for example 3840 x 2160 on a 4K screen), so DLSS makes the full picture itself and FSR 1 has nothing left to enlarge. It needs a build lifted with this version (tools/setup.py redoes the lift): when the lift could not confirm the game code, or the memory could not be grown, the game stays at 1080p and the log says why.
tradeoff = Experimental until tested in game. Every step up costs GPU time and video memory: 2160p is about four times the pixels of 1080p. Leave it at 1080p if anything looks wrong.

[TOTK_ASPECT]
name = Aspect ratio (experimental)
tab = graphics
group = Resolution and shape
type = choice
default = -
choices = -:16:9 (game's own)|21x9:21:9 (2560x1080, 3840x1600)|43x18:43:18 (3440x1440)|32x9:32:9 (super ultrawide)|1.85:1.85:1 (cinema)
summary = Show more of the world at the sides on an ultrawide screen (Hor+), instead of black bars. Needs a re-lift.
detail = The camera's view is widened to this shape, so you see more to the left and right while the height stays the game's own. The full-screen menus keep a 16:9 layout in the middle; how the HUD is placed is the next setting. Shapes narrower than 16:9 (16:10, 4:3) are not supported and stay 16:9. Picking an ultrawide Output resolution sets the shape on its own; use this to widen the 1080p canvas too. The approach is the public ultrawide mods' (camera aspect plus UI layouts), done in memory: no files are changed, and the game's own UI files are only adjusted when they are exactly the ones 1.4.3 ships (a mod's own layouts are left alone).
tradeoff = Experimental until tested in game: some cutscenes, the map or menus may show stretched or cut-off edges. A wider view costs some GPU and CPU time.

[TOTK_ASPECT_HUD]
name = HUD placement on wide screens
tab = graphics
group = Resolution and shape
type = choice
default = -
choices = -:In the corners|center:In the middle 16:9|off:Stretched (no layout changes)
summary = Where the HUD sits when the picture is wider than 16:9 (Aspect ratio or an ultrawide Output resolution).
detail = In the corners moves the minimap, hearts, stamina, item and button prompts out to the screen's edges, as on a native ultrawide game. In the middle keeps the whole HUD in a 16:9 box in the centre, easiest on the eyes on very wide screens. Stretched leaves the game's UI files alone: everything is drawn across the full width and looks wide. Full-screen backgrounds (pause menu, map fades, loading) always fill the screen.
tradeoff = Corners can put HUD pieces at the very edge of a 32:9 screen; Stretched distorts text and icons.

[TOTK_MENU_BG_FIX]
name = Quick-menu background fix
tab = graphics
group = Display
type = bool
default = on
on = -
off = 0
summary = Fix the black background behind the quick menus (weapon, bow, shield wheels) above 30 FPS.
detail = The game captures the 3D scene as the menu's blurred background one frame into the menu's opening animation; above 30 FPS that frame can come too late and the menu opens on black. This moves the capture to the first frame of the animation, in memory (no files are changed). It is applied only when the game's menu file is exactly the 1.4.3 one; when a mod already does the same (like the community Blackscreen Fix in the Mods tab), the mod's file is left as it is, so either way works.
tradeoff = Needs an in-game test; if the menus ever look odd, turn this off and use a mod for it instead.

[TOTK_VK_DEPTH_BIAS_FIX]
name = Shadow depth bias at the game's strength
tab = graphics
group = Display
type = bool
default = on
on = -
off = 0
summary = Give the sun's shadow maps the depth bias the game asks for (16-bit shadow maps are kept here as 32-bit float depth, where the same number came out about 256 times weaker).
detail = The game pushes its shadow-map depth a little away (depth bias) so surfaces do not shadow themselves. It asks for the bias in steps of its 16-bit depth format; the port keeps those shadow maps as 32-bit float depth, where one step is about 256 times smaller, so the bias was much weaker than on the Switch. This gives the bias in the game's own units (VK_EXT_depth_bias_control on current NVIDIA / AMD drivers; otherwise scaled by 256, never more than the game asks for). It is a correctness fix with no confirmed visible symptom: the bands of ground floating in the air (2026-10-30) were not shadows and this does not change them (see Performance > Stutter > Video memory > Shared texture memory blocks).
tradeoff = Not yet checked in game. If small objects' shadows look detached from them (peter-panning) or shadows go missing, turn this off and report it. Off (since 0134) also leaves VK_EXT_depth_bias_control out of the device, exactly as before 0123.
[TOTK_TEX_SHARE_SWIZZLE]
name = Map screen fix (shared textures)
tab = graphics
group = Display
type = bool
default = on
on = -
off = 0
summary = Show the map screen (and other pictures the game draws, then reads back through another texture description).
detail = The game draws the map into a texture, then shows it through a second description of the same memory that only changes which colour channels are read (for example alpha read as 1). That second description used to get a copy of its own, filled from game memory and never from the GPU's drawing: the map was black. With this on, both descriptions share the one texture and each reads it with its own channel order.
tradeoff = If a texture's colours look wrong (wrong channel, e.g. solid boxes behind text), turn this off and report it.

[TOTK_VK_BC_TARGETS]
name = Draw into compressed textures
tab = graphics
group = Display
type = bool
default = on
on = -
off = 0
summary = Let the game draw into its compressed (BC) textures, as it does when it builds some textures on the GPU.
detail = The game encodes some textures on the GPU: it draws the compressed blocks of a BC4 texture through an uncompressed view of the same memory. Those draws used to be skipped ("not attachable (compressed)" in the log), leaving the texture with whatever it held before. With this on, the texture is made so that Vulkan can render into its blocks (when the GPU and driver allow it).
tradeoff = If some surfaces show noisy or blocky patterns that were not there before, turn this off and report it.

[TOTK_ANISO]
name = Texture filtering (anisotropic)
tab = graphics
group = Image quality+
type = choice
default = -
choices = -:Game's own|2:2x|4:4x|8:8x|16:16x
summary = Keep textures on the ground and walls sharp at a slant. 16x costs almost nothing on a PC GPU.
detail = The game sets a low anisotropic filtering level for the Switch. This raises it for every texture that uses mipmaps with smooth filtering (it never lowers a level the game asked for, and leaves pixel-art, shadow and lookup textures alone). The GPU's own limit always applies.
tradeoff = Very little GPU cost; on rare textures it may show slight shimmer.
recommended = 16

[TOTK_QUALITY_REDUCTION]
name = Remove quality reduction (experimental)
tab = graphics
group = Detail and pop-in
type = choice
default = -
choices = -:Game's own|off:Removed (always full detail)
lift = quality
summary = Stop the game from lowering its detail when a frame gets busy, so objects stop popping to simpler versions.
detail = On the Switch the game drops to lower-detail models and effects while a scene is heavy, which shows as pop-in and blurrier objects in towns, fights and fast travel. This keeps the full-detail path. It is the same change as the community "Remove Quality Reduction" patch, made in the game code that tools/setup.py translates on your PC: the scan must find exactly one place in your own 1.4.3 game files that matches, otherwise this stays greyed out and the reason is shown here and in the problem report (data/generated/lift-scan.txt).
tradeoff = Experimental until tested in game. Costs some GPU and CPU time in busy scenes; at a locked 60 FPS a slower PC may drop frames there. Set it back to Game's own if anything looks wrong.

[TOTK_LOD_IMPROVE]
name = Improve LOD (experimental)
tab = graphics
group = Detail and pop-in
type = bool
default = off
on = 1
off = -
lift = lod
summary = Keep the detailed models of distant objects for longer, for less visible pop-in at a distance.
detail = Skips the game's own check that switches distant objects to their simpler models early, like the community "Improve LOD" patch. The place in the game code is found by the build-time scan in your own 1.4.3 files (the build id and the instructions must match exactly); when it is not found, this stays greyed out with the reason.
tradeoff = Experimental until tested in game. More objects drawn in full detail costs GPU and CPU time, most in wide views over Hyrule; some far objects may flicker. Turn it off if the frame rate drops below 60.

[TOTK_SHADOW_RES]
name = Shadow resolution (experimental)
tab = graphics
group = Detail and pop-in
type = choice
default = -
choices = -:Game's own|512:512|1024:1024|2048:2048 (experimental)|4096:4096 (experimental, heavy)
lift = shadow
summary = Sharper, less blocky shadows from the sun. 1024 is a safe step up; 2048 and 4096 are heavy.
detail = Sets the size of the game's sun shadow maps. The game's video memory (its texture heap and the application pool) grows to match automatically, in memory only. The place in the game code is found in two steps: tools/setup.py scans your own 1.4.3 files, and when more than one place could be it, the game checks while you play which one really makes the shadow map (Advanced > Troubleshooting > Shadow-size check) and the next tools/setup.py run uses that one. Until exactly one place is confirmed this stays greyed out, and the problem report includes what was found. The game's own size is shown in diag/lift-confirm.txt once confirmed; 512 can be lower than the game's own.
tradeoff = Experimental until tested in game. 2048 uses 4 times and 4096 16 times the memory and GPU time of 1024 for shadows; 4096 can cost several milliseconds a frame and break the 60 FPS target on mid-range GPUs. Shadows far away may get a little softer at the edges on some sizes.

[TOTK_GAME_FXAA]
name = Game's own anti-aliasing (FXAA)
tab = graphics
group = Detail and pop-in
type = choice
default = -
choices = -:Game's own (on)|off:Off (experimental)
summary = Turn off the game's own FXAA blur for a sharper picture, for example with DLSS or a high output resolution.
detail = The game smooths edges with FXAA, which also softens textures. Off removes it in two ways: when the build-time scan found the game's FXAA switch in your own 1.4.3 files, it reads as off; and whenever the FXAA pass is still drawn, the port copies its input through unchanged instead (that pass is recognised by its shader and its exact shape, so other passes are never touched). DLSS already takes the picture from before FXAA, so this mainly matters for FSR 1 and native resolution. The log line "[draws] game FXAA off" counts the passes copied through.
tradeoff = Experimental until tested in game. Without FXAA, edges shimmer more at native resolution; use it with DLSS, FSR 1 or a high output resolution.

[TOTK_FULLSCREEN]
name = Start in fullscreen
tab = graphics
group = Display
type = bool
applies = live
default = off
on = 1
off = -
summary = Open the game in borderless fullscreen instead of a window.
detail = Uses borderless desktop fullscreen: your display keeps its resolution and refresh rate, alt-tabbing is instant, and the upscaler above fills the screen.
tradeoff = None worth noting. You can still switch at any time.
recommended = 1
tip = In game, F11 or Alt+Enter switches between window and fullscreen.

[TOTK_WINDOW_SIZE]
name = Window size
tab = graphics
group = Display
type = choice
applies = live
default = -
choices = -:1280 x 720|1600x900:1600 x 900|1920x1080:1920 x 1080|2560x1440:2560 x 1440|3840x2160:3840 x 2160
summary = Size of the game window when it is not fullscreen.
detail = The window can still be resized by dragging its edges. Sizes larger than your desktop are shrunk to fit by Windows.
tradeoff = A bigger window enlarges the picture more, so it leans more on the upscaler.

[TOTK_OPERATION_MODE]
name = Console mode
tab = graphics
group = Display
type = choice
default = -
choices = -:Docked (TV)|handheld:Handheld
summary = Whether the game behaves as if the Switch were docked to a TV or held in hand.
detail = Docked renders at the higher TV resolution, the way the game looks on a television. Handheld uses the lower portable resolution and the game's portable settings.
tradeoff = Handheld is lighter on the GPU but noticeably blurrier on a large screen.

[TOTK_DRS]
name = Dynamic resolution
tab = graphics
group = Display+
type = bool
default = off
on = 1
off = -
summary = Let the game lower its resolution on the fly when a frame is heavy, as on the Switch.
detail = By default the port keeps the scene at a fixed size, because a PC GPU has headroom to spare. Turning this on restores the Switch's own behaviour of shrinking the picture when a frame gets expensive.
tradeoff = Can help a weak GPU hold its frame rate, at the cost of a softer, shifting picture.

[TOTK_PRESENT_MODE]
name = Present mode
tab = graphics
group = Display+
type = choice
applies = live
default = -
choices = -:Automatic (mailbox when available)|mailbox:Mailbox (no tearing, low latency)|fifo:V-Sync (FIFO)|immediate:Immediate (tearing allowed)
summary = How finished frames go to the screen. Automatic is right for almost everyone.
detail = The game's own pacing does not depend on this; it only decides how a finished frame is shown. Mailbox shows the newest frame at the next refresh without tearing. V-Sync queues every frame in order (smoothest on some displays, a little more latency). Immediate shows a frame the moment it is done, which can tear but has the lowest latency. A mode the display does not offer falls back to Mailbox or V-Sync, and the log says so.
tradeoff = Immediate tears; V-Sync adds about a frame of latency.

[TOTK_TRIPLE_BUFFER]
name = Triple buffering
tab = graphics
group = Display+
type = choice
applies = live
default = -
choices = -:Automatic|on:On (3 images)|off:Off (as few as the display allows)
summary = How many images the swap chain keeps. Automatic is one more than the display's minimum.
detail = On keeps at least three images (one shown, one waiting, one being drawn), which smooths out frame pacing with V-Sync. Off uses as few as the display allows, for the lowest latency.
tradeoff = On adds a little latency and video memory; Off can stutter with V-Sync when a frame runs long.

# ---------------------------------------------------------------- Performance

[TOTK_FPS]
name = Frame rate target
tab = performance
group = Frame rate
type = choice
applies = live
default = 30
choices = 30:30 FPS (original)|60:60 FPS|120:120 FPS (experimental)
summary = The highest frame rate the game aims for. 60 is smooth and well tested.
detail = 30 runs the game exactly as on the Switch. 60 and 120 unlock the game's frame pacing and step game time, cloth and hair by the real time between frames, so the game keeps its normal speed whatever the frame rate.
tradeoff = Higher targets need a faster CPU and GPU. 120 is experimental: some animations and effects may misbehave.
recommended = 60

[TOTK_INTERVAL_HOLD]
name = Frame pacing hold
tab = performance
group = Frame rate
type = int
applies = live
default = 8
min = 0
max = 30
step = 1
unit = frames
zero = Game decides
needs = TOTK_FPS=60,120
summary = How long the game must stay fast before it steps back up to the full frame rate.
detail = When a frame runs long the game drops to half rate. This is how many good frames in a row it needs before it returns to full rate. Holding a little longer avoids constant flipping between rates, which feels like stutter.
tradeoff = Higher values feel steadier but stay at half rate longer after a busy moment; 0 leaves it to the game.

[TOTK_MAX_INTERVAL]
name = Lowest frame rate step
tab = performance
group = Frame rate
type = choice
applies = live
default = -
choices = -:Half rate (default)|1:Never drop|3:One third rate|0:Game decides
needs = TOTK_FPS=60,120
summary = How far the game may drop its frame rate when it cannot keep up.
detail = The game picks a "present interval": 1 is the full target, 2 is half of it. By default it may only fall to half rate, so at a 60 FPS target it never drops below 30. "Never drop" pins it to the full target, and slow frames slow the game down a little instead.
tradeoff = Allowing deeper drops keeps game speed exact on slow machines but looks choppier.

[TOTK_BG_FPS]
name = Frame rate in the background
tab = performance
group = Frame rate
type = choice
applies = live
default = -
choices = 0:Off (no limit)|15:15 FPS|-:30 FPS (default)|60:60 FPS
summary = Limits the frame rate while the game window is not in front, to save power and keep the PC responsive.
detail = When you switch to another window (or minimise the game) it keeps running, but draws at most this many frames a second. The moment the game window has the focus again the limit is gone. Sound keeps playing normally: it runs on its own clock. At a 60 or 120 FPS target the game keeps its normal speed at any limit; at the original 30 FPS target 30 changes nothing and 15 runs the game at half speed while it is in the background.
tradeoff = None while you play. Off draws in the background as fast as in front, using the GPU and CPU for nothing; 15 saves the most but slows the game down at the 30 FPS target.
recommended = -
tip = Also on the in-game overlay's Performance tab.

[TOTK_REALTIME]
name = Real-time game clock
tab = performance
group = High frame rate fixes+
type = bool
default = on
on = -
off = 0
needs = TOTK_FPS=60,120
summary = Keep game time in step with real time at 60 or 120 FPS. Leave this on.
detail = The game was written to advance its clock by a fixed 1/30 s per frame. With this on, each frame advances by the time that really passed, so the game runs at normal speed at any frame rate. Off is only for comparison: at 60 FPS the game would run twice as fast.
tradeoff = Off breaks game speed above 30 FPS.

[TOTK_FRAME_STEP]
name = Game clock step
tab = performance
group = High frame rate fixes+
type = choice
default = -
choices = -:Measured (real frame time)|fixed:Fixed (1/60 s per frame at 60)
needs = TOTK_FPS=60,120
summary = How far game time moves each frame. Measured keeps the game at real speed even when the frame rate dips.
detail = Measured (the default) advances game time, cloth and hair by the real time between frames, averaged over the last five, so the game keeps its normal speed at any frame rate. Fixed advances exactly 1/60 s (or 1/120 s) every frame, as console 60 FPS patches do: perfectly even steps when your PC holds the target, but the game slows down whenever it cannot (at 45 FPS it runs at 75 % speed). Use Fixed only as a fallback if Measured ever makes motion feel uneven.
tradeoff = Fixed is slow motion whenever frames run long.

[TOTK_CLOTH_REALTIME]
name = Real-time cloth and hair
tab = performance
group = High frame rate fixes+
type = bool
default = on
on = -
off = 0
needs = TOTK_FPS=60,120
summary = Move cloth and hair by real time too, so they don't flutter too fast at high frame rates.
detail = Cloth and hair physics has its own clock. This applies the same real-time correction to it. Turn it off only to compare.
tradeoff = Off makes capes and hair move too fast above 30 FPS.

[TOTK_HIGHFPS_FIX]
name = Bounce and fade fix
tab = performance
group = High frame rate fixes+
type = bool
default = on
on = -
off = 0
needs = TOTK_FPS=60,120
summary = Correct trampoline-style bounces and object fade-ins that assume 30 FPS.
detail = Some game logic counts frames instead of time. This fix scales those counters so bouncy surfaces launch you the right height and distant objects fade in at the right speed.
tradeoff = Off restores the original frame-counted behaviour (wrong above 30 FPS).

[TOTK_FADE_FIX]
name = Fade-in fix
tab = performance
group = High frame rate fixes+
type = bool
default = on
on = -
off = 0
needs = TOTK_FPS=60,120
summary = The fade-in half of the fix above, on its own switch.
detail = Corrects how quickly distant objects and actors fade in at high frame rates. Only takes effect while the bounce and fade fix is on.
tradeoff = Off: objects fade in faster than intended above 30 FPS.

[TOTK_FREE_CORES]
name = Let Windows place game threads
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = Stop Ultra Instinct Tears from pinning the game's threads to the Switch's three cores.
detail = The Switch runs the game on three CPU cores and the port mirrors that layout, which matches the game's timing best. With this on, Windows decides where each thread runs instead.
tradeoff = May help on CPUs with few cores; usually slightly worse frame pacing.

[TOTK_VK_RECORD_THREADS]
name = GPU command threads
tab = performance
group = CPU+
type = int
default = -
auto = Auto
min = 1
max = 8
step = 1
unit = threads
summary = How many CPU threads build the GPU's work each frame.
detail = Auto uses 6 threads on CPUs with 16 or more logical cores, 5 on 12 to 15, 4 on 8 to 11, 2 on 4 to 7, otherwise 1. More threads shorten CPU time per frame on big scenes. Debugging tools force 1.
tradeoff = More threads use more CPU; 1 is the slowest but simplest path.

[TOTK_VK_CHUNK_SPLIT]
name = GPU command split size
tab = performance
group = CPU+
type = int
default = -
auto = Auto (600)
min = 0
max = 5000
step = 100
unit = draws
summary = How many draws each GPU command thread gets at most before the work is split again.
detail = Auto is 600. The port splits each frame's GPU work into pieces that the GPU command threads build at the same time. Without this, a big render pass (the main scene) stayed one piece that one thread built alone while the others waited. 0 splits only where the render target changes, as before.
tradeoff = Smaller pieces spread the work better but add a little GPU overhead per piece.

[TOTK_VK_POOL_FASTPATH]
name = Faster memory lookups
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = The GPU command threads remember which game memory is already up to date this frame, instead of asking a shared lock for every buffer of every draw.
detail = Each draw looks up about 20 buffers, and the threads used to queue behind one shared lock for 0.5 to 5.7 ms per frame. With this on, a buffer already checked in the same submission is looked up without the lock. Any change to the memory table, and every new submission, makes the threads check again, so the picture is identical. Box test: 0 stale uses over millions of racing lookups, and about 40 times the lookups a second; the first play test with it on showed no rendering problems. The log's per-frame line "pool lookups without the lock" shows how often it helped, and the "lock waits ... pools" figure should be low.
tradeoff = None known: it saves CPU time and the result is the same. Off goes back to taking the lock for every lookup, for comparing logs or ruling it out when hunting a bug.

[TOTK_VK_IMAGE_INDEX]
name = Faster image bookkeeping
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Fixes most of the slowdown while running through new areas: searches of the texture list no longer hold the shared images lock while they walk past every texture.
detail = Several checks (each new texture's first upload, buffer reads over GPU-drawn memory, the copy-back at the end of each submission, game memory invalidations) used to walk the whole list of textures (2,500 standing, 4,000 and more running) while holding the lock the six GPU command threads need for every texture they bind. A 2026-10-31 log showed frame time following that lock wait (r = 0.92), with each wait growing from 62 to 160 microseconds as the list grew. With this on, the checks read compact side lists (the textures over a memory range, or the few waiting for a copy-back) and find exactly the same textures in the same order. Box test: identical results over 600,000 random steps; each search holds the lock 10 to 200 times shorter. The log's per-frame line "image scans with the images lock held" shows how many searches ran and their time, next to "lock waits ... images".
tradeoff = None known: the same textures are found, only faster; a little memory (about 50 bytes per texture). Off goes back to the full walks, for comparing logs (running A/B) or ruling it out when hunting a bug.

[TOTK_VK_IMAGE_CREATE_UNLOCKED]
name = Make new textures without the lock
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = New textures and texture views are created without holding the shared images lock, so the GPU command threads don't stop each time the game streams in a texture.
detail = While running through new areas the game makes about 5 textures and 5 views per frame. Each one (creating the Vulkan image and its memory, 0.1 to 0.3 ms) used to happen with the images lock held, so the six GPU command threads waited for it (the log's "new images" time). With this on the texture is made first, then put in under the lock; if another thread put in the same one meanwhile, that one is used and the spare is thrown away before the GPU ever sees it. The log's per-frame line "made without the images lock" counts both, and how often a spare was thrown away.
tradeoff = Rarely a texture or view is made twice and one is thrown away (counted in the log). Off goes back to making them with the lock held, for comparing logs or ruling it out when hunting a bug.

[TOTK_VK_IMAGE_LOOKUP_LOCKFREE]
name = Find textures without the lock
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = The GPU command threads find the textures a draw uses without taking the shared images lock, so they stop queuing behind each other and behind the game while running through new areas.
detail = Each of the six GPU command threads looks up every texture a draw binds. When its own small cache misses (each new submission, each texture it has not seen yet), it used to take the images lock, which the game's texture creation and releases also hold. A 2026-10-31 running log showed the translation thread's largest piece of work stretching to 26 ms, with 129 ms of images lock waits every 300 frames. With this on, the lookup reads the texture table directly. A texture removed or a table enlarged at that moment makes it fall back to the old locked lookup, so it finds exactly the same texture. Old tables are freed only when no thread can still be reading them, at the start of the next submission. Box test: identical answers to the old table over 5.8 million random steps, no wrong or freed answers over 39 million racing lookups, and about 66 times faster lookups in a box microbenchmark (a box number, not an in-game frame rate). The log's per-frame line "images lock by site" shows "lock-free" lookups and how often they fell back.
tradeoff = A little memory: an enlarged texture table keeps its old copy until the next submission. Off goes back to taking the lock for every lookup the cache misses, for comparing logs (running A/B) or ruling it out when hunting a bug.

[TOTK_VK_BUFREAD_MEMO]
name = Remember buffer reads that change nothing
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = A buffer read over memory that a GPU drawing is about to be copied back to is checked once, and not again with the images lock until one of those drawings changes.
detail = When a draw reads a buffer from memory near a texture the GPU drew, the GPU command thread takes the images lock to see whether that drawing must be copied back to game memory first. Usually nothing needs to change, but the same buffers are read draw after draw. With this on, each thread remembers the buffers whose check changed nothing. Anything that could change the answer (a drawing waiting to be copied back, or a texture the game let go of or took back) makes every thread check again, so the result is identical. Box test: the same marks and log lines as checking every time over hundreds of thousands of random steps. The log's per-frame line "images lock by site" shows "buffer reads over GPU drawings: known unchanged / looked at".
tradeoff = A few KB of memory per thread. Off goes back to checking every time, for comparing logs or ruling it out when hunting a bug.

[TOTK_VK_BUFREAD_ACTIONABLE]
name = Check buffer reads only where a GPU drawing could still need copying back
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Skip the images-lock check of a buffer read when every GPU drawing under it is already set to be copied back, so the six GPU helper threads stop queuing behind each other on that lock.
detail = When a draw reads a buffer from memory near a texture the GPU drew, a GPU helper thread takes the images lock and looks at every drawing waiting to be copied back to game memory. That look only changes something when one of those drawings is not yet set to be copied back, or was let go by the game; in the 2026-10-31 20:48 Lookout Landing log it ran 200-400 times a frame and the lock was held 0.4-4.6 ms and waited on 0.1-4.9 ms a frame by the helper threads, nearly always to change nothing. With this on, each drawing that a look could still change is counted per megabyte of game memory, and a buffer read with no such drawing under it skips the look. The count changes only with the images lock held, at every place that changes what a look would do, so the result is identical. Box test: the same marks and log lines as looking every time over two million random steps (93% of looks skipped there), plus threads under TSAN. The log's per-frame line "images lock by site" shows "buffer reads over GPU drawings: known unchanged / nothing to change / looked at". (Full path: Performance > CPU+ > Check buffer reads only where a GPU drawing could still need copying back)
tradeoff = A few KB of memory. Off goes back to looking every time, for comparing logs or ruling it out when hunting a bug (flicker or stale ground textures: set it Off and send the log).

[TOTK_VK_BUFREAD_RANGE]
name = Look only at GPU drawings over a buffer read's memory
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When a draw reads a buffer, look only at the GPU drawings over that buffer's memory under the images lock, not at every drawing waiting to be copied back.
detail = When a draw reads a buffer from memory near a texture the GPU drew, a GPU helper thread takes the images lock and looks for GPU drawings over that memory that must be copied back to game memory first. Before, it looked at every drawing waiting to be copied back and worked out each one's size, every time. In the 2026-11-01 Lookout Landing logs, for the first ~1,500 frames after a load, 250-420 reads a frame looked at ~57,000 drawings. The lock was held ~5 ms and waited on ~10 ms a frame, and not one of those drawings was over the read. With this on, each waiting drawing is kept with its memory range, and a read looks only at the ones over its own memory, in the same order, with the same tests, so the result is identical. It also lets "Check buffer reads only where a GPU drawing could still need copying back" skip reads from the start. Before, that switch waited for 32 log lines that never came, so it never skipped a read. Box test: the same drawings in the same order as the old look over 600,000 random steps, and the same marks over 2 million steps. The log's per-frame lines "image scans" ("buffer reads N images") and "images lock by site" show the effect. (Full path: Performance > CPU+ > Look only at GPU drawings over a buffer read's memory)
tradeoff = 16 bytes per waiting drawing. The only other difference is fewer "[alias] buffer" log lines: none for reads that change nothing. Off goes back to looking at every waiting drawing, for comparing logs or ruling it out when hunting a bug (flicker or stale ground textures: set it Off and send the log).

[TOTK_VK_READBACK_AHEAD]
name = Copy GPU results the game reads back with the frame that draws them
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = A small image the game's CPU has read back once (such as a 1x1 value the GPU computes) is copied back to game memory as part of every later frame that draws it, so the game's read no longer waits for the queue and the GPU.
detail = Some GPU results are read by the game's CPU, for example the three 1x1 images seen in the logs (what they hold is not known; probably values like brightness). Before, each such read made the game thread wait twice. First for the translation thread to replay everything queued so far, which already includes the next frame's work. Then for the GPU to finish all of that plus a copy of its own. In the 2026-11-01 Lookout Landing logs this happened about 1.5 times a frame, always for the same three 1x1 images. Each read waited up to 29 ms, and these reads were in most of the long frames whose log line shows "queue drain waits". With this on, once the game has read such an image (64 KiB or less, at most 256 images), it is copied back at the end of every submission that draws it, and it lands before that submission's fence is reached. The game's own fence wait then already covers it, and the read finds nothing left to copy. The game reads the image as of the last finished frame that drew it, as on the console. Before, the value could also include later frames still in the queue. Box test: the same choice as before for every image that was never read back; in a model of submissions, GPU completion and the game's fence waits and reads, no read is older than the frame the game waited for, and after the first read there are no more waits; Off gives the same reads, values and waits as before. The log line "[iwb] read back ahead" counts the images and copies, and the "[iwb] per frame" line's "explicit reads" and "stall" should drop to near 0. (Full path: Performance > CPU+ > Copy GPU results the game reads back with the frame that draws them)
tradeoff = One tiny copy per submission that draws such an image (a 1x1 image is 4-16 bytes). Off goes back to copying them only when read (each read waits for the queue and the GPU), for comparing logs or ruling it out when hunting a bug (wrong brightness or exposure flicker: set it Off and send the log).

[TOTK_VK_WRITETEXELS_QUEUED]
name = Queue the game's small texture writes instead of waiting for the queue
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When the game writes a small texture from the CPU (WriteTexels), the write is put in the translation thread's queue, in order, and the game thread goes on at once, instead of first waiting for everything already queued to be replayed.
detail = Before, every WriteTexels made the calling game thread wait until the translation thread had replayed everything queued so far (a frame of work or more), so the queued frames would still see the texture as it was before the write. In the 2026-11-01 Lookout Landing logs this happened 0.03 to 0.1 times a frame, 2 to 7 ms each time (0.1 to 0.6 ms a frame on average, all of it in single frames). With this on, a write to a texture level of 256 KiB or less becomes a job in that same queue: it runs after the frames queued before it and before anything the game submits after it, so every frame sees the same texture contents as before. The game's data and the texture description are copied when the call is made. For a texture the GPU has drawn to, the GPU copy no longer waits for the GPU (its upload memory belongs to its own submission until that submission's fence). Larger textures are written as before. The one difference: the game memory under the texture holds the new texels only once the job has run; the game's own later reads go through the queue anyway (ReadTexels, texture and pool deletes wait for it), only a direct CPU read of that memory would not. Box test: in a model of the queue, the texture as each submission sees it is the same with this on as with the old wait, and the game thread no longer waits; the probe that writes at once (no queue) must fail and does. The "[critical path] queue drains by cause" line's WriteTexels count should drop to near 0, and the log shows "[UIT 0256] WriteTexels ... queued". (Full path: Performance > CPU+ > Queue the game's small texture writes instead of waiting for the queue)
tradeoff = The translation thread does the write's texture layout work (small: 256 KiB at most). Off goes back to the wait, for comparing logs or ruling it out when hunting a bug (a texture or lighting that looks out of date or wrong: set it Off and send the log).

[TOTK_VK_TEX_DIRTY_ROWS]
name = Upload only the written rows of changed textures
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When the game changes a few spots of a big texture from the CPU, only the rows of the texture around the changed memory pages are uploaded to the GPU again, not the whole texture.
detail = In the 2026-11-01 1.0.0 log (the dips after the map marker) one 5120x5120 BC4 texture of 16.7 MiB (7 levels, a world-sized mask the game patches in small spots) was uploaded again whole after every patch: 2 to 6 times in a frame during the dips. Each upload is done under the lock all recording threads share, so the other threads waited: lock waits went from 3.2 ms in frames without such an upload to 11.1 ms with 2 and 19.9 ms with 4, and frame times from 26.5 to 33.6 ms (39 ms with 5 or more). With this on, a texture that is not ASTC, not streaming, not 3D, not in a virtual pool and not drawn by the GPU since its last upload is checked page by page: only the 8-row strips (GOB rows) that hold a written page are read out of game memory and copied into the image. If that is more than half the texture, it is uploaded whole as before. The written pages are found by a fresh write-watch scan, so a write made after this submission's first look is not missed. Box test: after random patches of that texture (and of RGBA8, array and packaged textures), the image built from the uploaded strips is exactly the texture; every GOB row a written byte lands in is marked (brute force over the block-linear layout); a write after the epoch's scan is seen. 4 patches of the 5120x5120 texture upload 2.0 MiB instead of 17 MiB. The log shows "[UIT 0310] texture ... only the written rows uploaded again, X KiB of Y KiB". (Full path: Performance > CPU+ > Upload only the written rows of changed textures)
tradeoff = A second, smaller write-watch scan of the texture's memory before such an upload. Off goes back to uploading the whole texture each time, for comparing logs or ruling it out when hunting a bug (a texture that looks out of date in places, for example map or ground marks: set it Off and send the log).

[TOTK_VK_WRITETEXELS_REGION]
name = Write only the changed region of a texture the game patches
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When the game writes a small region of a big texture (WriteTexels), only that region is laid out into game memory, and the write is queued instead of making the game thread wait.
detail = Before, every WriteTexels read the whole texture level out of game memory, put the region in, and laid the whole level out again: for a small patch of the 5120x5120 BC4 texture in the 2026-11-01 1.0.0 log that is 12.5 MiB read and 12.5 MiB written per patch, and every page of the level counted as written (so the whole texture was uploaded again). And because the level is bigger than 256 KiB, "Queue the game's small texture writes" did not apply: the game thread waited for the translation queue each time (3 to 9 ms in the dip frames; 160 to 460 ms of such waits per 300 frames in the bad stretches, against 4 to 12 ms in calm ones). With this on, a region of at most half the level is written straight into the 16-byte pieces of game memory under it, the exact same bytes at the same addresses, and the 256 KiB limit is measured on the region, so these writes are queued too. Larger regions are written as before. Box test: for BC4, BC1, RGBA8, R8, RGBA32F, array, 3D, packaged and linear textures the game memory after region writes is byte for byte what the old whole-level way gives, and nothing outside the region changes; the field-log patch now fits the queue. The log shows "[UIT 0311] WriteTexels of texture ... only the region laid out" and the "[critical path] queue drains by cause" WriteTexels count should drop. (Full path: Performance > CPU+ > Write only the changed region of a texture the game patches)
tradeoff = None known; it does less work. Needs "Queue the game's small texture writes" on for the queueing part. Off goes back to the whole-level layout, for comparing logs or ruling it out when hunting a bug (a texture that looks wrong after the game changes it: set it Off and send the log).

[TOTK_VK_UCAP_FASTSORT]
name = Faster sorting of the data saved at each submission
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = The game thread sorts the uniform and vertex data it saves at each GPU submission with half the work, and sorts only the vertex and index ranges it really copies, so the submit call returns sooner.
detail = At each GPU submission the game thread saves the small buffers the draws read (uniform data) and any vertex or index data the game wrote recently, so the GPU threads see them as they were. The 2026-10-31 Lookout Landing 4K profile (t254) put this at 1.48 ms of the game thread a frame, inside the submit call: 0.34 ms sorting and merging and 0.57 ms checking about 10000 vertex and index ranges, of which about 340 are copied. With this on, the ranges are sorted with one pass over the start address plus a small fix-up for ranges starting at the same address (instead of two full sorts), and the vertex and index ranges are de-duplicated with a hash table and checked first, so only the few that are copied get sorted. The same ranges are saved in exactly the same order. Box test: identical results to the old sorts over 576 random and worst-case inputs, two broken versions caught; 24329 ranges sorted in 311 instead of 437 microseconds and 10132 vertex and index ranges picked in 30 instead of 145 microseconds (box numbers, not in-game frame rates; expect roughly 0.2-0.4 ms less game thread time a frame). (Full path: Performance > CPU+ > Faster sorting of the data saved at each submission)
tradeoff = About 100 KB of memory for the game thread's hash table. Off goes back to the old two-pass sort of every range, for comparing logs (running A/B) or ruling it out when hunting a bug.

[TOTK_VK_ASYNC_SUBMIT]
name = Submit GPU work on its own thread
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Hand each finished batch of GPU work to a separate thread that passes it to the graphics driver, so the translation thread can start on the next batch right away.
detail = Handing work to the driver (vkQueueSubmit) took the translation thread up to about 9 ms per frame in recent logs, with spikes to 13 ms. That is most of the "moves + submit" time in the log, and more than half of a 60 FPS frame. With this on, a separate thread called "totk-vk-submit" does that step. Work is still handed over strictly in order, and a frame is only shown after its work has been handed over. Memory and objects are still reused or destroyed only after the GPU has finished with them, so the picture should be identical. In the log, the per-frame "queue submits" time now belongs to the new thread. The line "submit thread: a submission waited ... ms" shows how long finished work queued for the driver: in the 2026-10-30 long play about 0.5 ms typically and up to 6 ms when the driver step itself was slow, while the translation thread's own "moves + submit" fell from about 3.2 ms a frame (without it, another log) to 0.1 ms.
tradeoff = On by default since UIT 0151, after a long play test (about 290,000 frames, closed normally, no GPU errors) with it on. It frees up the translation thread but does not make the driver itself faster: if the driver step alone takes longer than a frame, the new thread becomes the limit instead. It adds one more busy thread. Off (0) goes back to submitting on the recording thread, for comparing logs or ruling it out when hunting a bug.

[TOTK_VK_EARLY_STREAM]
name = Stream each frame's GPU work to the card as it is prepared
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Hand each finished piece of a frame's GPU work to the graphics card as soon as it and everything before it are prepared, instead of all at once at the end, so the card starts several ms sooner.
detail = In the 2026-10-31 20:26 log (all four switches of 0230-0234 on), the heavy areas ran at 17-22 ms a frame, and 5-7 ms of that was the game waiting for the GPU: the frame's work reached the card only once all of it was prepared (about 7.7 ms after the game handed it over), and then the card needed 9-11 ms, one after the other. With this on, any of the threads preparing the work hands the finished pieces over in order as soon as there are at least 200 draws ready (up to 8 hand-overs a frame), through the separate submit thread, so no preparing thread waits for the driver. The card starts after about the first piece instead of after the last. The last piece still tells the game the frame is finished, exactly as before: nothing the game reads back (counters, copies of drawn images, memory the GPU wrote) is reported any earlier, and memory of a frame is reused only after its last piece has finished. The log line "recording threads: TOTK_VK_EARLY_STREAM" shows how many pieces went early per submission. Only used when the GPU work is prepared on several threads (the usual case). The setting "Let the GPU start a frame before it is fully prepared" (2 or 3 parts), if set, replaces this with the older plan.
tradeoff = Same protocol as the older 2- or 3-part option (one 18-minute play with 2 parts), now sent sooner and more often; box tests run it on threads with Windows-like locks. The card's measured "GPU" time in the log now includes short gaps while it waits for the next piece, so it reads a little higher; judge by ms per frame and "fence waits". If you see flicker, missing objects or a crash, set it Off (0) and send the log.

[TOTK_VK_CHUNK_RAMP]
name = Hand the GPU its first pieces of a frame sooner
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Cut the first pieces of each frame's GPU work smaller (200 draws each for the first six, then 400, then 600 as before), so the card can start on a frame sooner and the next pieces are ready about as fast as it uses them.
detail = With "Stream each frame's GPU work to the card as it is prepared" on, the card starts once the first piece of a frame is prepared, and pieces go in order. In the 2026-10-31 20:48 log at Lookout Landing the first pieces were the heaviest (600 draws, 4.3-5.3 ms to prepare against about 2.7 ms for the others), so the card waited about 6 ms after the game handed the frame over. With this on, the first six pieces are 200 draws each and are prepared side by side by the six helper threads, then one of 400, then 600 as before; up to 14 hand-overs a frame instead of 8 (the extra six for the small pieces). A box model of that frame: the card starts 1.8 ms sooner and finishes the frame 1.7 ms sooner (0.9 ms on a frame without the heavy start). Only used with the stream on and the split size above 0. The log line "[UIT 0241] TOTK_VK_CHUNK_RAMP" says whether it is in use. (Full path: Performance > CPU+ > Hand the GPU its first pieces of a frame sooner)
tradeoff = About four more pieces a frame: each restarts the render pass on the same images (some tens of microseconds of GPU time a frame in all) and is one more submission on the submit thread. Measured only in a box model, not in the game yet: compare ms per frame and "fence waits" On vs Off at Lookout Landing. If you see flicker or missing objects, set it Off (0) and send the log.

[TOTK_VK_EARLY_PARTS]
name = Let the GPU start a frame before it is fully prepared
tab = performance
group = CPU+
type = choice
default = -
choices = -:automatic (the stream above; 1 part when it is Off)|2:2 parts|3:3 parts
summary = Hand the first finished pieces of each frame's GPU work to the graphics card while the rest is still being prepared, so the card starts sooner.
detail = Each frame's GPU work is prepared by several threads at once and, until now, given to the graphics card in one go only when every piece was ready. The game then waited for all of the preparation and then all of the GPU work, one after the other (about 8.6 ms + 9.6 ms in the 2026-10-30 long play log: most of the 5.7 ms per frame of "fence waits"). With 2 or 3 parts, once the frame's work has been split up, the pieces that are already prepared are handed over first, in order, and the card starts on them while the threads prepare the rest. The last part tells the game the frame is finished, exactly as before: nothing the game reads back (counters, copies of drawn images, memory the GPU wrote) is reported any earlier, so reads that must see the current frame and the grass fix are unaffected. Memory and objects of a frame are still reused only after its last part has finished. In the log, "recording threads: TOTK_VK_EARLY_PARTS" shows how many pieces went early. Only used when the GPU work is prepared on several threads (the usual case).
tradeoff = The older plan, kept for comparison: in the one play log with 2 parts it sent a piece early only 0 to 0.8 times per submission, because it waited until half of the draws were ready while another piece was still being prepared. Since UIT 0236 the stream above (on by default) does this job better; automatic uses it, and 1 part as before is "stream Off". 2 or 3 set here replaces the stream. Each part costs one more hand-over to the driver, done by the separate submit thread in order. If you see flicker, missing objects or a crash with 2 or 3, set it back to automatic and send the log.

[TOTK_VK_PCORES]
name = Prefer performance cores (hybrid CPUs)
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = On Intel CPUs with performance and efficiency cores, keeps the translation and GPU command threads on the performance cores.
detail = Windows sometimes runs these threads on efficiency cores, which are much slower for this work, and the frame waits for them. Does nothing on CPUs that have one kind of core (AMD Ryzen, older Intel); the log says which it found ("TOTK_VK_PCORES=1: ... hybrid" or "not hybrid").
tradeoff = The game's own threads then have the performance cores less to themselves. Try it on a hybrid CPU only, and compare frame times with it off.

[TOTK_THREAD_MMCSS]
name = Multimedia scheduling for frame threads
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = Asks Windows to schedule the threads every frame waits for like game and audio threads (MMCSS "Games").
detail = Every frame waits for three threads: the game's present thread, the translation thread and the GPU command recording threads. Normally the translation and recording threads run at "highest" priority and the present thread at normal priority, so the game's ~50 worker threads and background programs can delay them. With this on they join the Windows Multimedia Class Scheduler Service task "Games", which Windows uses for exactly this: they run in the real-time priority band while they work, and Windows still keeps a share of the CPU for everything else. With "Prefer performance cores" also on, the present thread is kept on the performance cores too. The log shows "joined MMCSS task "Games"" for each thread and a "thread policy: ..." line every 300 frames. Earlier logs said "time-constraint policy ...: failed" and "realtime policy inactive": that was a macOS-only call that does nothing on Windows, not a broken setting; those lines now say what Windows actually did.
tradeoff = New (off until tested). Can make the rest of the PC (music, a browser, recording software) less responsive while the game runs. If frame times get worse, turn it off.

[TOTK_HYBRID_PLACEMENT]
name = Core placement (hybrid CPUs)
tab = performance
group = CPU+
type = choice
default = -
choices = -:Off (Windows decides)|p:Game and graphics on performance cores|1:Game and graphics on performance cores, background on efficiency cores
summary = On Intel CPUs with performance and efficiency cores: which kind of core each of the port's threads may run on.
detail = Only where threads may run is changed (Windows "CPU sets"); priorities stay as they are. "Game and graphics on performance cores": the game's own threads, the graphics translation, recording and submission threads and the presentation thread run on the performance cores only (this includes what "Prefer performance cores" does). The second choice also moves background work to the efficiency cores: shader compiling (warm-up and in-game), the staging-memory thread, writing the save to disk, and the unpacking of big files (64 KiB and more; the thread goes back to the performance cores afterwards). On CPUs with low-power efficiency cores as well (Core Ultra laptops) those are left out, as they are too slow. Does nothing on CPUs with one kind of core (AMD Ryzen, older Intel); the log says what it found ("[totk] hybrid CPU: ...") (Full path: Performance > CPU+ > Core placement (hybrid CPUs)).
tradeoff = Not yet tested in the game, so it stays off. Expected: steadier frame times on hybrid CPUs (the game and the graphics threads are no longer put on slow cores, and background work no longer takes performance cores from them). Background work runs more slowly on the efficiency cores: shaders may take longer to appear the first time and big areas may load a little more slowly. Compare frame times with it off.

[TOTK_FRAME_CORE]
name = Give the game's frame thread a performance core of its own
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = On Intel CPUs with performance and efficiency cores, when "Core placement (hybrid CPUs)" or "Prefer performance cores" is on: one physical performance core (both of its hyperthreads) is kept for the game thread that draws and presents each frame; all other threads placed on the performance cores share the rest.
detail = In the 2026-10-31 20:48 log at Lookout Landing, the game's frame thread did 15.1 ms of its own work per 21.9 ms frame, while about 3.4 cores' worth of other threads (the six recording threads alone 30 ms of CPU per frame, in Windows' real-time "Games" band) ran on the same performance cores and could take its core or its hyperthread twin. With this on, the thread that has presented 60 times in a row (the game's real frame thread, not a boot or loading thread) moves to the physical performance core with the highest number (core 0 takes most of Windows' interrupts); the translation, recording, submit and presentation threads and the game's other threads keep the other performance cores (7 of 8 on an i9-12900K). The log says "[UIT 0237] frame thread ... now on its own performance core". Does nothing on CPUs with one kind of core (AMD Ryzen, older Intel), with fewer than 4 performance cores, or when neither placement setting is on (Full path: Performance > CPU+ > Give the game's frame thread a performance core of its own).
tradeoff = Not yet measured in the game. Expected: 0.5-1.5 ms less of the frame thread's own work in busy areas, and fewer slow frames when the recording threads are busy. The other threads have one performance core fewer; if the "translation" or "recording" times in the log rise by more than that, or frames get worse, set it Off (0) and send the log.

[TOTK_DIRTY_INDEX]
name = Find memory pools through an index
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Find which of the game's memory pools holds an address with a sorted index instead of going through every pool in turn. Speeds up the pool copies at the start of each frame's GPU work, the vertex and index checks on the game's frame thread and the texture checks on the recording threads.
detail = The write watch keeps one record per memory pool the game made: about 3,500 at Lookout Landing (2,921 live), and every check of game memory (has the game written these vertices, this texture, this pool since the last copy?) first looks up the pool. A lookup that did not repeat the thread's last pool went through every record: about 2.3 microseconds each on the test machine. A frame's GPU work starts with ~440 pool copies looked up in address order (nearly all such misses: about 1 ms of the translation thread's 1.3 ms "prologue", which with "Stream each frame's GPU work to the card as it is prepared" is time before the GPU can start), the frame thread checks ~10,000 vertex and index ranges, and each recording thread looks up pools for its textures. With this on, a binary search over the pools sorted by address answers instead (box test tools/tests/test_dirty_index.c: 441 lookups 1.0 ms -> 0.02 ms, 10,000 lookups of the frame thread's kind 0.95 -> 0.08 ms), checked against the pool's record each time; while a pool is being added or removed the old search answers. The log says "TOTK_DIRTY_INDEX=1" once and "memory pool lookups through the index" each second (Full path: Performance > CPU+ > Find memory pools through an index).
tradeoff = Not yet measured in the game. Expected: about 1 ms less before each frame's GPU work starts (the "prologue" in the [critical path] line), 0.3-0.5 ms less on the game's frame thread ("vertex / index write checks" in the uniform capture line), and less CPU on the recording threads. Off (0) is the old search exactly.

[TOTK_YIELD_BACKOFF]
name = Idle thread back-off
tab = performance
group = CPU+
type = choice
default = -
choices = -:Off|on:On (250-2000 us)
summary = Let idle game threads sleep a little instead of spinning. Saves some CPU, may drop frames.
detail = When a game thread has nothing to do it normally yields the CPU right away. With back-off on it sleeps for growing short periods instead. A value already in ultrainstincttears.cfg such as "2000:250" (cap:start in microseconds) is kept and shown as Custom.
tradeoff = Measured on Mac: 3% less CPU but more dropped frames. Off is recommended.

[TOTK_PREEMPT_POINTS]
name = Switch game threads at calls
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = Let a more important game thread take over a CPU core when the running thread makes a call, not only when it waits.
detail = The port runs the game's threads on three "virtual cores" like the Switch. A thread used to give its core away only when it waited, slept or yielded, so an important thread (for example the one that prepares the next frame) could stand in line behind a busy low-priority thread for a long time. With this on, each running thread checks at every system call and every jump to a function the game looks up at run time whether a more important thread is waiting for its core, and steps aside if so. It never steps aside while the port itself is busy inside one of its own functions (so no lock is held when it does). When nothing better is waiting, the check costs two memory reads.
tradeoff = Off by default until it has been play-tested: it changes the order in which the game's threads run, which in theory could expose timing bugs in the game. Both sibling ports run this way. Also needed for the setting below.

[TOTK_ASYNC_PREEMPT]
name = Interrupt long-running game threads
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
needs = TOTK_PREEMPT_POINTS=1
summary = If a more important game thread has waited 250 microseconds for a core, interrupt the running thread wherever it is in the game's code.
detail = Some game code runs for a long time without making a call, so the check above never runs. With this on, the waiting thread pauses the running one (Windows SuspendThread), and if it is in the game's own code and not inside a port function, sends it to a small routine that saves all its registers and steps aside, then resumes it exactly where it was. A thread is interrupted at most once a millisecond. The waiting thread also briefly borrows the running thread's priority so it is not starved by threads in between. Parts the game marks as "do not interrupt" are respected, as on the Switch. The log line "switch points on (TOTK_PREEMPT_POINTS); asynchronous preemption on (TOTK_ASYNC_PREEMPT)" confirms it started, after a line "asynchronous preemption: N lifted functions in M exact ranges" saying what it checked; if it cannot start it says why in "asynchronous preemption off: ...". "[sched]" lines every 300 frames count its interruptions.
tradeoff = Experimental: interrupting a thread from outside is the riskiest kind of change. A mistake would show as a rare crash or a hang. Off: threads change cores only at calls (above) and waits.

[TOTK_AP_EXACT_RANGES]
name = Let thread interruption find the game's code function by function
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
needs = TOTK_ASYNC_PREEMPT=1
summary = Fixes "Interrupt long-running game threads" never starting: it now tells the game's code from the port's own code function by function, instead of as one block that, in the default build, also held the port's code.
detail = Interrupting a thread is only safe while it runs the game's own code. The check used to take everything between the first and the last game function as game code, and refuse to start if a port function lay in between. With link-time optimisation (setup's default) the linker puts the very large game files that are compiled without optimisation first and everything optimised (the port and the other game files) after them, so port functions always lay in between and the setting never started ("asynchronous preemption off: the lifted code range is unknown or holds host code" in every log so far). With this on, each game function's exact start and end are taken from the program's own unwind table (the table Windows uses for exceptions), and a thread counts as running game code only inside one of them; a port function inside one stops it from starting, as before. Small game functions without an entry in that table are simply never interrupted. The log line "asynchronous preemption: N lifted functions in M exact ranges ..." shows what it found, including whether the old check would have refused. Box tests: the range lookup against a brute-force search, the link layout as it really is (the old single range must fail on it and does), and the Windows toolchain check reads the ranges of a real LTO link. Saves nothing by itself: it lets the setting above start at all. (Full path: Performance > CPU+ > Let thread interruption find the game's code function by function)
tradeoff = Only matters with "Interrupt long-running game threads" on, which stays off by default until play-tested. Off goes back to the old single-range check (which refuses in the default build), for comparing logs.

[TOTK_FS_YIELD_CORE]
name = Free the core during file reads
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = While a game thread waits for a file read or write, let another game thread use its core.
detail = On the Switch a thread that reads from the game card is blocked, so the other threads run. The port did file reads while still holding the thread's virtual core, so the other threads on that core waited for the disk too. With this on, the thread gives the core up for the duration of each file call and takes it back afterwards, the same way the port already does for graphics calls that wait for the GPU. The file code does not run any game code meanwhile.
tradeoff = None known. Off: the old way (the core stays busy during file reads), for comparing logs.

[TOTK_NVN_POOL_YIELD_CORE]
name = Free the core while setting up graphics memory
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = While the game sets up or releases a block of graphics memory, let another game thread use its core.
detail = Setting up a graphics memory pool registers its memory with the GPU, and releasing one waits for the GPU to finish with it; both can take milliseconds during loading and streaming. With this on, the thread gives up its virtual core meanwhile, like other graphics calls that wait. That code does not run any game code.
tradeoff = None known. Off: the old way.

[TOTK_PRECISE_SLEEP]
name = Precise short sleeps for game threads
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When a game thread asks to sleep for less than a millisecond, wake it on time instead of after one or two whole milliseconds.
detail = Game threads sleep for short times in two places: when the game asks to sleep (SleepThread with a time) and when a thread that keeps giving up its core backs off for 20-200 microseconds. On Windows these went through the toolkit's nanosleep, which rounds every sleep up to whole milliseconds and then wakes on the system tick, so a 50-microsecond pause could take 1-2 ms on a frame budget of 16.7 ms. With this on, those sleeps use a high-resolution waitable timer (Windows 10 1803 and later) and finish the last few microseconds with CPU pauses, so they end within a few microseconds of the asked time, never before it. If the high-resolution timer is not available the old sleep is used. Box test: thousands of sleeps against a timer waking anywhere from half to one and a half times the asked time never woke early, and real sub-millisecond sleeps were not rounded up to milliseconds. (Full path: Performance > CPU+ > Precise short sleeps for game threads)
tradeoff = A sleeping thread may spend up to about 20 microseconds of a sleep in CPU pauses instead of sleeping. Off goes back to the old millisecond sleeps, for comparing logs.

[TOTK_GUEST_LOCK_SPIN]
name = Retry the game-thread scheduling lock briefly before sleeping
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When two game threads want the scheduling lock at once, the second retries for a moment instead of going straight to sleep in Windows.
detail = Every game-thread wait, wake, yield, signal and core hand-off takes one lock that guards the game-thread scheduler. It is held only for a moment, but on Windows a thread that finds it busy went straight to a kernel wait and could only run again after Windows woke it (often tens of microseconds, sometimes far longer under load), and every later unlock then paid a kernel call too. With this on, a thread that finds the lock busy retries about 40 times with short CPU pauses (a few microseconds in all) and only sleeps if it is still busy. Who gets the lock and what it protects are unchanged. The per-frame log section "critical path" gets a line "guest scheduling lock" showing how often it was busy and taken after retrying, and how often and how long threads slept on it. Advanced: TOTK_GUEST_LOCK_SPIN can be set to a number of retries (default 40). Box test: eight threads hammering the lock (with condition waits on it) kept every count exact, plain and under ThreadSanitizer and AddressSanitizer, with retries 0, 40 and 5000; a lock that skipped holding it was caught. (Full path: Performance > CPU+ > Retry the game-thread scheduling lock briefly before sleeping)
tradeoff = A thread waiting for the lock uses its core for a few microseconds before sleeping. Off sleeps right away as before, for comparing logs.

[TOTK_SYNC_WAKE_TARGETED]
name = Wake only the game threads waiting on a signaled event
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When the game signals an event, only the threads waiting on that event wake up, instead of every thread waiting on any event.
detail = Many game threads (audio, input, services, loaders) sleep waiting for system events. Before, each time any event was signaled (or a game thread ended), every one of those sleeping threads woke up, took a CPU core slot again (queueing behind the game's busy threads when all were in use), found its own event still unsignaled and went back to sleep - many times a frame, competing with the threads the frame needs. The Switch's own system wakes only the waiters of the signaled event, and with this on so does the game here. A thread whose wait list holds a handle that was closed meanwhile is still woken, as before, so nothing a thread would have seen is missed. The per-frame log section "critical path" gets a line "guest event signals" with how many waiting threads were woken and how many were left asleep. Box test: a random model of thousands of signals, thread exits and closed handles against waiters with up to 64 handles each, using the real code: every thread left asleep would have found nothing new on waking; with Off every thread is woken as before; two broken versions (looking only at the first four handles, or ignoring closed handles) were caught. (Full path: Performance > CPU+ > Wake only the game threads waiting on a signaled event)
tradeoff = None expected. Off wakes every waiting thread on each signal as before, for comparing logs.

[TOTK_VK_PRESYNC_PARALLEL]
name = Check the game's memory writes on all helper threads at a frame's start
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Split the memory-write checks at the start of each GPU submission across all recording threads, so the frame's GPU work starts sooner.
detail = At the start of each GPU submission the game's memory pools used recently are brought up to date on the GPU. For each, Windows is first asked which pages the game wrote (a write-watch call over the whole pool), one pool after another on one thread, while the six recording threads waited for their first work. In the 2026-10-31 log at Lookout Landing that was about 480 pools and 1.3 ms a frame ("write watch" 1.29 ms, prologue 1.31 ms), and the frame then waited longer for the GPU. With this on, those write-watch calls are first handed out to all recording threads and the translation thread together; then the pools are copied exactly as before, in the same order, using what the calls found (no page is skipped: a page written meanwhile is found at the next submission, as before). Fewer than 24 pools, or only one recording thread: as before. The per-frame log gets a line "write-watch scans before the pool copies" with the time this took. Box test: the real code with a stand-in for Windows' write watch: On copies exactly the same pages as Off, and with the game writing all the time no page is ever left stale; six broken versions were caught. (Full path: Performance > CPU+ > Check the game's memory writes on all helper threads at a frame's start)
tradeoff = Untested in game: if Windows serializes these calls inside the kernel the gain is small. If geometry or textures look wrong, set this to Off: the checks then run on one thread as before.

[TOTK_VK_PRESYNC_BY_CHUNK]
name = Bring the game's memory up to date chunk by chunk so the GPU starts sooner
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = At the start of each GPU submission, bring up to date only the memory pools that the submission's first chunk of draws needs, and the others just before the chunk that needs them, so the first work can reach the GPU while the rest is being prepared.
detail = At Lookout Landing (2026-11-01 logs) the frame waits on the GPU, and nothing went to the GPU until a submission's prologue was over: 1.1 to 1.5 ms a frame, most of it bringing about 440 memory pools up to date (write-watch checks, then the copies), although the first chunk of draws uses only some of them. With this on, each pool remembers the first chunk that used it in the last submissions. The prologue brings up to date only the pools that chunk 0 used and the ones no chunk has used yet (as before, the write-watch checks on all recording threads). The translation thread then brings each other pool up to date a few chunks before the chunk that used it first last time, and the rest at the end of the walk. With the early stream on, the finished first chunks may go to the GPU while the walk still runs. Nothing can be read stale even when the guess is wrong: every draw, dispatch and copy still brings a pool up to date itself when it is not current yet (counted as "later from draws" in the frame line), and those copies always reach the GPU before that draw. The log shows "[UIT 0258] ... the first work reaches the GPU X ms after the submission's start" with either setting (the number to compare), plus how many pools were done in the prologue, during the walk and at its end. Box test: in a model of 440 pools over 200 frames no chunk ever reads a pool that is not current and no pool is copied twice; the probe without the draw's own sync must fail and does, and so does a stamp that keeps the last chunk instead of the first. (Full path: Performance > CPU+ > Bring the game's memory up to date chunk by chunk so the GPU starts sooner)
tradeoff = Off by default since the 2026-11-01 A/B (UIT 0312): two runs at Lookout Landing, only this switch changed, compared at matched draw counts. On, the first work did not reach the GPU any sooner (2.9 ms in both runs), the recording threads waited 3.3 ms a frame for the memory table's lock (0.6 ms Off) and frames were about 0.75 ms longer (39 % over 16.7 ms against 26 % Off). Leave it Off unless you are comparing. The translation thread now does the write-watch checks of the pools it brings up to date later itself (not spread over the recording threads), so its walk gets longer; the GPU should still start sooner. When the first chunks use different pools from frame to frame, more draws sync a pool themselves ("later from draws" goes up): raise the lead below. Off goes back to all pools in the prologue, for comparing logs or ruling it out when hunting a bug.

[TOTK_VK_PRESYNC_BY_CHUNK_LEAD]
name = How many chunks ahead memory pools are brought up to date
tab = performance
group = CPU+
type = int
default = -
auto = Auto (2)
min = 0
max = 32
step = 1
unit = chunks
summary = Only does something with "Bring the game's memory up to date chunk by chunk so the GPU starts sooner" On (Off by default): how many chunks before the one that used a pool first last time it is brought up to date.
detail = A pool that the chunk 2 chunks earlier needs this time is brought up to date anyway with the default. Higher: fewer draws have to sync a pool themselves ("later from draws" in the frame line), but more pools in the prologue, so the GPU starts a little later. 0: exactly before the chunk that used it. (Full path: Performance > CPU+ > How many chunks ahead memory pools are brought up to date)
tradeoff = Only the timing changes, never what is drawn.

[TOTK_VK_RETIRE_PCORES]
name = Finish GPU frames on a performance core
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Run the thread that hands each finished GPU frame back to the game on the performance cores, so the game's wait for the GPU ends sooner.
detail = When the GPU finishes a frame, one helper thread (the "retire" thread) wakes up, copies what the GPU wrote back into the game's memory and then tells the game the frame is done; the game waits for exactly this every frame. It was the only graphics thread left where Windows chose to put it, which on a CPU with performance and efficiency cores is often a slower efficiency core that also wakes up later. With this on it runs on the performance cores like the other graphics threads (only when performance-core placement is on; on other CPUs nothing changes). The per-frame log gets a line "[UIT 0250] after the GPU finishes" with the time this thread takes per frame. Box test: Off leaves the thread exactly as before, and the thread's work is unchanged apart from the timing; four broken versions were caught. (Full path: Performance > CPU+ > Finish GPU frames on a performance core)
tradeoff = Untested in game; the gain is likely small (a fraction of a millisecond a frame). If the game stutters more, set this to Off.

[TOTK_VK_PRESENT_QUEUE]
name = Show frames on a GPU queue of their own
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = Hand finished frames to the screen on a second GPU queue, so the next frame's GPU work never waits behind a frame being shown.
detail = The thread that shows frames and the thread that sends the game's GPU work shared one GPU queue and one lock. Showing a frame (the driver's present call) can block inside the driver for a while, and the next frame's GPU work then waited for it, leaving the GPU idle while the game waited for the GPU. In the 2026-10-31 log the per-frame "queue submits" time was 4.4 ms a frame in the heaviest window, and 423 of 1126 long frames had more than 5 ms of it (up to about 30 ms). With this on, frames are shown on a second queue of the same GPU queue family (NVIDIA cards have 16; cards whose family has only one queue keep sharing it as before) under a lock of its own. The frame's picture is still waited for on the GPU before it is shown. The per-frame log gets a line "queue lock waits" with the time threads waited for these locks. Box test: the real lock code in threads: with a second queue showing a frame never waits for the GPU-work lock, with Off (or one queue) it is the very same lock as before; two broken versions were caught. Not testable in game on the box: compare "queue lock waits" and frame times with Off. (Full path: Performance > CPU+ > Show frames on a GPU queue of their own)
tradeoff = Untested in game. If the picture stutters, flickers or the game fails to start, set this to Off: frames are then shown on the same queue as before.

[TOTK_SPIN_GATE]
name = Let waiting game threads step aside
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = When a game thread keeps checking whether another thread is done, let the other thread have the core.
detail = The game has 857 short loops that check a value over and over until another thread changes it. On the Switch each thread has its own core, but here three cores are shared by all game threads, so the thread being waited for may not get to run while the waiting thread keeps its core busy. With this on, each pass of such a loop pauses the CPU briefly, and once a wait has lasted longer than the hand-off time below while another thread is waiting for a core, the waiting thread lends its core out and takes it back afterwards. The loops are found when the game code is converted (setup), so they only take effect after the next setup run.
tradeoff = Not yet tested in the game; can help in busy scenes where threads wait for each other, can cost a little in scenes where waits are very short. Off: loops run exactly as before.

[TOTK_SPIN_HANDOFF_US]
name = Waiting thread hand-off time
tab = performance
group = CPU+
type = int
default = 50
min = 0
max = 1000
step = 10
unit = microseconds
needs = TOTK_SPIN_GATE=1
summary = How long a game thread checks a value before it lends its core out.
detail = Short waits (a lock held for a moment) are cheaper to wait out on the core; longer ones are better handed over. 0 hands the core over on the first pass when another thread is waiting.
tradeoff = Lower: other threads get the core sooner but cores change hands more often. Higher: fewer hand-overs, longer waits.

[TOTK_LIFT_REGCACHE]
name = Faster game code translation
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
summary = Keep the game's busiest values in the PC's own registers instead of re-reading them from memory. Takes effect after the next setup run.
detail = The game's code is converted from Switch code to PC code when setup runs. The old conversion keeps every Switch register in memory, and because the game's memory reads and writes could in principle touch that memory, the PC re-reads the registers around almost every one of them. With this on, each converted function keeps its six most used registers and the condition flags as local values the compiler can hold in PC registers, and writes them back before anything outside the function can look at them (calls, system calls, jumps through tables, traps). Every function is checked while it is converted: if undoing the change does not give back exactly the old code, that function keeps the old code. Changing this setting makes the next setup run convert the code again (a few minutes) and rebuild the game; turning it off goes back to the old conversion.
tradeoff = Not yet tested in the game; expected to make game code a little faster (fewer memory reads and writes in busy loops). Debug tools that read the registers in the middle of a function (watch points, crash reports from inside game code) may show older values. Since 0190 every loop in the converted code re-reads game memory on each pass (without that, a game thread waiting on a flag that its own search for spin waits did not recognise could wait forever: box test test_lift_restrict.py). Off: the code is converted exactly as before.

[TOTK_LIFT_REGCACHE_FLAGS]
name = Flags from the compared values
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
needs = TOTK_LIFT_REGCACHE=1
summary = With faster game code translation on: answer the game's "is a less than b" style checks straight from the two values compared, instead of packing and unpacking the Switch condition flags. Takes effect after the next setup run.
detail = The Switch CPU compares two values by setting four condition flags, and a later instruction tests the flags. Done literally, the PC builds the four flags after every compare and takes them apart again for every test. With this on, the translation keeps the two compared values (or the result, for a bit test) and turns each test into one PC compare of those values, wherever it can prove which compare the test belongs to. When it cannot (a test that two different compares can reach, a call in between, code that reads the raw flags), that test keeps the flags as before, and the compares that feed it keep building them. Where the flags must be handed to other code (a call, a return) they are built there, once, from the kept values. Every function is checked while it is converted: if undoing the change does not give back exactly the code without it, that function keeps that code.
tradeoff = Not yet tested in the game; expected to make tight game loops a little faster (fewer instructions per compare-and-branch). Changing it makes the next setup run convert the code again (a few minutes). Off: the flags are kept as with "Faster game code translation" alone.

[TOTK_LIFT_RESTRICT]
name = Game registers kept apart from game memory
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
needs = TOTK_LIFT_REGCACHE=1
summary = (Test.) With faster game code translation on: when setup converts the game's code, tell the compiler that the game's memory reads and writes never touch the place where the Switch registers are kept, so it need not save and re-read every register around each of them. Takes effect after the next setup run.
detail = The registers of each game thread live in a PC structure the game has no address for, so no game memory access can reach it; the compiler cannot work that out by itself. With this on, each converted function says so (C "restrict" on its register pointer). Functions that hand off to the PC's own code for a system routine (HLE) keep the old form, and before them the compiler is made to assume everything may change. The functions' control flow is unchanged, so a profile made for "Faster game code (PGO)" (About tab) still matches. Meant on top of "Faster game code translation", where it removes most of the slowdown that setting has around calls (Full path: Performance > CPU+ > Game registers kept apart from game memory).
tradeoff = Not yet tested in the game, so it stays off. Box tests (bit-identical results, tools/tests/bench_lift.py, 15 rounds): game-style loops 37% less time with this, "Faster game code translation" and "Flags from the compared values" on, against 27-29% for those two alone; an image decoder 54% less against 44%. Since 0192 only functions with a loop or kept registers get it (in small straight-line functions it only cost time), and loops re-read game memory before tail calls instead of at every function entry: the call-heavy kernel went from 39% slower to within 3-9% of the old code (box noise is about 5%). Alone it gains next to nothing. Changing it makes the next setup run convert the code again (a few minutes). Off: converted as before.

[TOTK_LIFT_RESTRICT_ALL]
name = Registers kept apart in every function
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
needs = TOTK_LIFT_RESTRICT=1
summary = (Comparison only.) With "Game registers kept apart from game memory" on: give every converted function that form, as 0190 did, instead of only the ones with a loop or kept registers. Takes effect after the next setup run.
detail = 0192 limits "Game registers kept apart from game memory" to the functions where it pays: on a small function without a loop the compiler then keeps more values in saved PC registers and pushes / pops them on every call. This brings back the 0190 behaviour, to compare in the game (Full path: Performance > CPU+ > Registers kept apart in every function).
tradeoff = Box test: same total time, about 1% slower on call-heavy code than the default. Changing it makes the next setup run convert the code again (a few minutes). Off: the 0192 rule.

[TOTK_LIFT_REGCACHE_CLEAN]
name = Write back only the registers a function changes
tab = performance
group = CPU+
type = bool
applies = setup
default = on
on = -
off = 0
needs = TOTK_LIFT_REGCACHE=1
summary = With faster game code translation on: before a call, write back to memory only the kept registers that may have changed since they were last read from memory; the others already match. Takes effect after the next setup run.
detail = "Faster game code translation" keeps up to six registers in the PC's own registers and writes them back before every call. A register that has not been changed since it was last read from memory (at function start or after the previous call) already has the same value in memory, so writing it back is wasted work. With this on (the default since 0192; per call site since 0193) those writes are left out. The check follows every path through the function to that call: if any path may have changed the register, it is written back, so the rule can only leave writes in, never take a needed one out. Box test test_regcache.py: 150 random programs x 12 starting states give the same registers, flags and memory as the old code and about 4 in 5 register write-backs are left out; with every write-back deliberately removed the same test fails all 40 programs (Full path: Performance > CPU+ > Write back only the registers a function changes).
tradeoff = Off: every kept register is written back at each call, as 0078 did (a few more memory writes around calls). Changing it makes the next setup run convert the code again (a few minutes).

[TOTK_LIFT_FPCR_HOST]
name = FP rounding in the PC's FP unit
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
needs = TOTK_LIFT_REGCACHE=1
summary = With faster game code translation on: when the game picks a rounding mode for decimal maths, set the PC's own FP unit to it once, instead of every maths step checking which mode the game asked for. Takes effect after the next setup run.
detail = The Switch CPU has a setting for how decimal (floating-point) results are rounded: to nearest, up, down or toward zero. The game sets it rarely (it is normally "to nearest"). Without this, every translated maths step reads that setting first and, for any mode other than nearest, takes a slower exact path. With this on, the moment the game changes the setting, the PC's FP unit is switched to the same mode (along with the "flush tiny numbers to zero" mode it already copies), so each maths step runs as one PC instruction with no check. The steps that must not follow the mode (round-half-away, round-to-nearest-even conversions, a negated product, unsigned conversions of zero) were rewritten to give the same answer in every mode; a test compares every FP helper in both forms on 2 million values under every combination of the game's FP settings (Full path: Performance > CPU+ > Faster game code translation > FP rounding in the PC's FP unit).
tradeoff = Not yet tested in the game; expected gain is small (one check less per FP step in physics and animation code). While the game uses a mode other than nearest, PC code called from game threads (system calls, the graphics driver) also runs in that mode; the game is not known to do that for long. Same tiny-number rule as before: a result just below the smallest normal that rounds up to it is kept (the Switch flushes it). Changing it makes the next setup run convert the code again (a few minutes). Off: as before.

[TOTK_NATIVE_LIBC]
name = PC versions of memory and text routines
tab = performance
group = CPU+
type = choice
default = -
choices = -:Off (the game's own)|1:On|check:Check (for testing)
summary = Run the game's basic memory and text routines (copy, fill, compare, search, string length and copy: memcpy, memset, strlen and 10 more) with the PC's own optimized versions instead of the game's converted Switch code.
detail = The game calls these thousands of times per frame, from everywhere (copying data, comparing names, filling buffers). The PC's versions use the CPU's wide vector instructions and give the same results the C standard requires: the same bytes written and the same return value. Two details are allowed by the standard and handled as follows: a compare returns the difference of the first two bytes that differ (the game's version may return only -1, 0 or 1; callers only use the sign), and a copy whose source and destination overlap (not allowed for memcpy) is done the safe way. "Check" runs the game's routines as before and also works out each result the PC's way, logging any difference as "[totk] libc: check: ..." (slower; only for testing). Needs "Prepare PC versions of memory and text routines" on at setup (Full path: Performance > CPU+ > PC versions of memory and text routines).
tradeoff = Not yet tested in the game, so this stays off: run once with "Check" and look for "[totk] libc: check:" lines before turning it on. Expected gain: small to moderate, mostly on loading and on frames with lots of copying. Off: the game's own routines (each call costs one extra check).

[TOTK_LIFT_NATIVE_LIBC]
name = Prepare PC versions of memory and text routines
tab = performance
group = CPU+
type = bool
applies = setup
default = on
on = -
off = 0
summary = When setup converts the game's code, give the game's memcpy, memset, strlen and similar routines (found by their exported names) a switch, so "PC versions of memory and text routines" can be turned on. Takes effect after the next setup run.
detail = The game's routines are converted exactly as before; a small front is added that goes on to them at once unless "PC versions of memory and text routines" is on or set to Check (Full path: Performance > CPU+ > Prepare PC versions of memory and text routines).
tradeoff = None expected with the routines setting off (one check per call). Off converts the code exactly as before; changing it makes the next setup run convert the code again (a few minutes).

[TOTK_LIFT_ISOLATE_O0]
name = Optimize the code next to unresolved jumps
tab = performance
group = CPU+
type = bool
applies = setup
default = off
on = 1
off = -
summary = (Test, off since 0134.) When setup converts the game's code, put each function the conversion has to build unoptimized in a file of its own, so the functions around it are optimized like the rest of the game. Takes effect after the next setup run.
detail = A few game functions jump through tables the conversion cannot read ahead of time; each becomes one big switch over all its instructions, which the compiler can only build quickly without optimization (-O0). That choice is made per file, and each file holds up to 1500 functions, so every function that happened to share a file with one of them was built unoptimized too (9 of the 1436 files in the 2026-10-30 build). With this on, those few functions get files of their own and only they stay unoptimized. The converted code of every function is exactly the same; only which file it is compiled in changes (Full path: Performance > CPU+ > Optimize the code next to unresolved jumps).
tradeoff = Off by default since 0134: it was the only change to the game's own code before the 2026-10-31 device losses, and a small function with unresolved jumps alone in its file is built optimized (-O2), not unoptimized as this text first said, so those functions run optimized for the first time. The first setup run after a change converts the code again and rebuilds every game file once (a few minutes more than a normal update). Off: files are packed as before.

[TOTK_WAIT_ON_ADDRESS]
name = Lighter thread waits
tab = performance
group = CPU+
type = bool
default = off
on = 1
off = -
summary = When one game thread waits for another (a lock, a signal, a free CPU core), sleep and wake with Windows' lightweight WaitOnAddress instead of the heavier condition variables of the threads library.
detail = The game's threads hand work to each other thousands of times per frame, and each hand-over that has to sleep goes through the port's thread layer. With this on, the sleep is a single Windows call on a counter (WaitOnAddress) and the wake another (WakeByAddressSingle), instead of the threads library's condition variable, which costs more Windows calls per wake. The rules stay the same: the waiting thread checks again after every wake, a wake given just before the sleep is never missed, and a timed wait never ends before its time (Full path: Performance > CPU+ > Lighter thread waits).
tradeoff = Not yet tested in the game, so it stays off. Expected gain: small (less time in each thread hand-over; most visible on CPUs with many threads busy). If the game ever freezes or stutters more with it on, turn it off. Off: as before.

[TOTK_DISPATCH_FLAT]
name = Faster function lookup
tab = performance
group = CPU+
type = bool
default = on
on = -
off = 0
summary = When the game calls a function through a pointer (virtual functions, callbacks) and the per-thread cache does not know it yet, find it with one table read instead of a search through the 300,000-odd functions of the game.
detail = Each game thread remembers the last 4096 function pointers it called; any other call has to find the converted function by address, which is a search through a sorted list (about 20 steps, each likely a cache miss, around 0.1 microseconds). With this on, each address found is also written to a flat table with one entry per possible function address, so the next time any thread needs it the answer is one read (about 0.01 microseconds in the box test). The table is filled only as functions are called, so it uses real memory only for the parts of the game's code that run (at most about as much memory as the code: some tens of MB reserved). Results are the same as the search: the table only remembers what the search found (Full path: Performance > CPU+ > Faster function lookup).
tradeoff = On by default (UIT 0127): the answer is always the one the search gives (box test with 8 threads and 16 million lookups), so it cannot change what the game does. Expected gain: small but certain (about 0.1 microseconds saved on each of the 400-550 slow lookups per frame seen in a 2026-10-30 play log, about 0.04-0.06 ms per frame). Uses some more memory as the game runs (only the touched part of the table, at most about the size of the game code). Off: the search every time, as before.

# ---------------------------------------------------------------- Stutter

[TOTK_SHADER_PREWARM]
name = Shader warm-up
tab = performance
section = Stutter
group = Shaders
type = choice
default = -
choices = -:Shaders you have seen|all:Every shader|0:Off
summary = Build shaders before you play instead of the first time something is drawn. Removes most hitches.
detail = The default (recommended) prepares every shader your past play sessions have needed, before the title screen; the list grows as you play. "Every shader" prepares all ~28,800 of the game's shaders and keeps them all in the graphics driver: the first run takes several minutes. A shader that crashed the driver or was refused while being prepared is skipped from then on (warm-skip.txt in data/shaders/ryujinx; delete it to try again). Off makes each shader the first time it is drawn, which hitches.
tradeoff = Longer start-up the first time. "Every shader" needs several GB more memory and crashed in the NVIDIA driver with 12 threads (2026-10-29): use it only to experiment.
recommended = -

[TOTK_SHADER_WARM_WAIT]
name = Wait for warm-up
tab = performance
section = Stutter
group = Shaders
type = int
default = -
auto = Auto (90 s, 600 s for every shader)
min = 0
max = 900
step = 15
unit = s
zero = Don't wait
needs = TOTK_SHADER_PREWARM=-,all
summary = How long boot waits for the warm-up before the title screen.
detail = The game waits up to this long at boot for shaders to finish; anything left continues in the background while you play. "Don't wait" goes straight to the title and warms up in the background.
tradeoff = Waiting longer means a slower start but fewer hitches in the first minutes.

[TOTK_SHADER_ASYNC]
name = Asynchronous shaders (experimental)
tab = performance
section = Stutter
group = Shaders
type = bool
default = off
on = 1
off = -
summary = Experimental: build a shader the warm-up missed on a background thread instead of pausing the game, and leave out what it draws until it is ready.
detail = Without this, the first time the game draws with a shader that is not ready yet, everything waits while the graphics driver builds it: a hitch, often a long one. With it on, two background threads build it and the game keeps going. Only ordinary drawing of the visible picture (the world, characters, the HUD) is left out meanwhile, at most for about half a second; anything other work reads later (shadow maps, reflections, compute and storage writes, depth-only passes, textures drawn once) still waits as before, so nothing is left broken after the shader is ready. The log line "[shaders] async" counts the shaders built in the background, the draws left out and the waits.
tradeoff = Pop-in: a new object, effect or HUD piece can be missing for a few frames the first time it appears. It does nothing for shaders the warm-up already built, so the warm-up stays the main fix. New, so off until a play test shows it helps.

[TOTK_SHADER_EARLY]
name = Start new shaders early
tab = performance
section = Stutter
group = Shaders
type = bool
default = off
on = 1
off = -
summary = Start building a new shader on a background thread as soon as the game loads it, instead of at the first draw that uses it. Nothing is skipped.
detail = The game hands each shader over when it loads a model or effect, usually some time before anything is drawn with it. Without this the graphics driver only starts building the shader at that first draw, and the whole frame waits: the long "shaders made" pauses in the log (9 s in all in an 86-minute play, the worst 0.9 s). With it on, three background threads start the build when the shader arrives, so most are ready by the first draw. A draw that comes first still waits for its shader, exactly as now, so nothing is left out or drawn wrong; and a shader first met at a draw is built without holding up the other recording threads. The log line "[shaders] early" says how many were ready at their first draw and how long draws still waited. Works with or without "Asynchronous shaders" (which is the one that may leave things out for a few frames).
tradeoff = Uses up to three more CPU threads at low priority while new areas load (plus one light thread that sorts out the shaders already known), and a little memory for shaders waiting their turn (at most 256 MiB). New, so off until a play test shows it helps: compare the "shaders made" times in the long submission lines with it off and on.

[TOTK_SHADER_WARM_THREADS]
name = Warm-up threads
tab = performance
section = Stutter
group = Shaders+
type = int
default = -
auto = Auto (CPU cores - 2, at most 6)
min = 1
max = 12
step = 1
unit = threads
summary = How many CPU threads build shaders during warm-up.
detail = Auto uses your logical CPU count minus two, at most 6. Once the boot wait is over these threads drop to below-normal priority.
tradeoff = More threads finish sooner but load the CPU and the graphics driver harder during start-up; 12 crashed the NVIDIA driver with "Every shader".

[TOTK_SHADER_BINARY_CACHE]
name = Keep compiled shaders
tab = performance
section = Stutter
group = Shaders+
type = bool
default = off
on = 1
off = -
summary = Off by default since UIT 0138: on 2026-10-31 two runs that loaded every shader from these files lost the GPU at the same draw entering Hyrule Field; with it off the same build went in. Save the graphics driver's compiled form of each shader on disk and load it in later runs.
detail = Files go to a "bin" folder inside your shader folder (data/shaders/ryujinx/bin by default); everything in it is made on this PC from your own shaders, nothing is downloaded. The 09:30 run wrote 8703 files; the 09:38 and 09:39 runs loaded 9317 shaders from them (0 refused by the driver) and both crashed (device lost) at the same terrain draw; the 09:41 run with this off played. Everything this side decides (which shader, stage, layout, device, file integrity) was checked and matches, so the driver's own binary does not run like the shader it came from. Nothing here can prove a binary runs correctly, so it stays off. With it on, a file is used only if the GPU, driver, every device setting, the shader and this build's layout all match, and only if the driver gives the same binary back after loading it. Files from 0136 / 0137 are never used again. Delete the bin folder at any time.
tradeoff = Off costs little: NVIDIA's own shader cache already makes a second compile take about 1.5 to 4 ms (the 09:30 log: 3.0 ms a shader). On (1) only for comparison; if the game crashes entering an area with it on, turn it off and delete the bin folder.

[TOTK_SHADER_BIN_BG]
name = Save compiled shaders in the background
tab = performance
section = Stutter
group = Shaders+
type = bool
default = on
on = -
off = 0
needs = TOTK_SHADER_BINARY_CACHE=-
summary = With "Keep compiled shaders" on: write the new files on a background thread, not on the thread the frame waits for.
detail = Each shader built while you play is saved to the bin folder so later runs load it instead of building it again. On writes the file on a low-priority background thread, so the disk never holds up a frame; Off writes it on the spot, as before. If the game is closed while files are still waiting, those shaders are simply built and saved again next time. The log line "shader binary cache:" (now also during play, every 64 new shaders) counts the files written and how many went through the background writer.
tradeoff = None known; Off only to compare.

[TOTK_SETUP_REWARM]
name = Warm up shaders after an update
tab = performance
section = Stutter
group = Shaders+
type = bool
applies = setup
default = off
on = 1
off = -
summary = After an update or a rebuild, make the shaders you have seen right away, so the next start does not wait for them.
detail = An update or a rebuild can make the graphics driver's saved shaders useless, so the next start spends minutes making them again (Wait for warm-up) and the rest comes as hitches. With this on, setup (also when the launcher installs an update) starts the game once more at the end: it opens its window, makes the shaders you have seen, shows "shaders: N of M" in the setup window and closes again before the title screen. The game's output goes to build\warm-shaders.log. Off: setup only says that the shaders changed; tools\setup.py --warm-shaders does the same at any time. Nothing is downloaded and no game file is changed.
tradeoff = The update takes longer (as long as the warm-up at a start, a few minutes with many shaders) and the game window opens on its own at the end of it. Off by default for that reason; it changes nothing in the game itself.


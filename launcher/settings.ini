# ---------------------------------------------------------------- Mods

[TOTK_MODS]
name = Load mods
tab = mods
group = Mod settings
type = bool
default = on
on = -
off = 0
summary = Lay the mods in the mods folder over the game's files when the game starts.
detail = Each mod is a folder in the mods folder with the Yuzu and Ryujinx layout: <mod>/romfs/... (a folder holding the game's own top-level folders such as Actor or UI also works, and so do extra folders around one romfs folder, such as atmosphere/contents/<title id>/romfs). A file a mod ships replaces the game's file of the same path; when two mods ship the same file, the one higher in the load order wins. The game's log lists every mod it loaded, how many files each one replaced and which mod won each conflict. Code patches (exefs, .ips, .pchtxt) and cheat files cannot work in a recompiled game and are listed as not loaded (Game > Cheats has the built-in ones).
tradeoff = None with no mods installed: the folder is checked once at start. Off starts the game with its own files only, to rule a mod out.

[TOTK_MODS_RESTBL]
name = Fit the resource size table to mods
tab = mods
group = Mod settings
type = bool
default = on
on = -
off = 0
needs = TOTK_MODS=-
summary = Raise the game's memory reservations for mod files bigger than its own, and add entries for files it does not have.
detail = The game reserves memory for each file from a table (System/Resource/ResourceSizeTable). A mod file larger than the game's, or one the game does not have, can crash the game or fail to load without a bigger entry, which is why mods for other emulators often ship their own copy of the table. With this on, the game is given a merge made at start: its own table, every entry of the tables your mods ship (the larger value of each, so two mods' tables no longer overwrite each other), and for each mod file the game's entry plus how much bigger the file is, or an estimate for a new file. Values only ever go up. The log line "resource size table merged" shows what changed.
tradeoff = A little more memory reserved for modded files. Off gives the game the table of the highest mod that ships one (or its own), as other emulators do.

[TOTK_MODS_DIR]
name = Mods folder
tab = mods
group = Mod settings
type = text
default = mods
hint = mods
summary = Where the mods are, relative to the game folder.
detail = The default is a folder named mods next to UltraInstinctTears.exe. load-order.txt in it keeps the order and which mods are on.
tradeoff = A folder that does not exist means no mods.

# ---------------------------------------------------------------- Advanced: troubleshooting

[TOTK_VK_CHECKPOINTS]
name = GPU crash checkpoints
tab = advanced
group = Troubleshooting
type = bool
default = off
on = 1
off = -
summary = If the game crashes with "device lost", turn this on so the log says what the GPU was doing.
detail = Places a marker before every draw so that after a GPU crash the log names the last commands the GPU reached (NVIDIA cards). Use with "Play with log" and share the log.
tradeoff = A few percent slower, and forces single-threaded GPU command recording.
recommended = -

[TOTK_VK_ALLOC_GUARD]
name = Keep video memory allocations under the driver's limit
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = When the game's memory pools and the images with memory of their own come near the driver's allocation limit (about 4096 on Windows), later render targets go into shared blocks instead. Leave this on.
detail = Each memory pool the game maps and each image with memory of its own is one Vulkan allocation; NVIDIA's Windows driver allows about 4096. Shrine exits load hundreds of images at once on top of 1500-3100 pools. Past about 3584 allocations alive, render targets, depth and storage images share blocks like textures (once, in the log: [UIT 0133]). Off: as before 0133.
tradeoff = Near the limit only: an image drawn over in part may show the leftovers described under "Shared blocks for render targets too (test)".

[TOTK_VK_SBUF_SCRATCH]
name = Separate stand-in for missing storage buffers
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = A storage buffer the game points at outside its memory pools gets a 16 MiB buffer of its own instead of the small shared 64 KiB stand-in. Leave this on.
detail = Logged as "storage buffer ... not in an imported pool ... an empty one is bound" just before each shrine-exit device loss of 2026-10-31 (shader 1df991d98c87). With a size of 0 the shader may read or write far past the 64 KiB stand-in; 16 MiB keeps those accesses in our memory and keeps its writes out of the zeros other stand-ins read. Off: the 64 KiB stand-in as before 0133.
tradeoff = 16 MiB of host-visible memory.

[TOTK_SHADER_BINARY_DEVKEY]
name = Shader binaries keyed to the device (test)
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = Use a saved shader binary only on a device set up exactly like the one that made it (GPU, driver, extensions, features).
detail = Until 0136 the shader binary cache did not record how the device was set up, so binaries made with one set of extensions or features (depth bias control, checkpoints, robust buffer access) were loaded on a device made with another. Each binary's key now holds the device's fingerprint (logged at startup as "device fingerprint"). Binaries from 0135 and before are never used again either way: the first run after this update compiles every shader once. Off: keys without the fingerprint, for comparison only (Full path: Advanced > Troubleshooting > Shader binaries keyed to the device (test)).
tradeoff = Changing a device setting (for example TOTK_VK_ROBUST or TOTK_VK_CHECKPOINTS) makes the next run compile its shaders again; the binaries of each setup take disk space side by side.

[TOTK_UCAP_QSORT]
name = Old sort for captured uniform ranges (test)
tab = advanced
group = Troubleshooting
type = bool
default = off
on = 1
off = -
summary = Sort the uniform ranges captured at each submit with the C library's qsort, as before 0128, instead of the radix sort. For a crash test only.
detail = 0128 replaced qsort with a radix sort giving the same order (by start, the longest first; checked equal on 3000 random cases including ties, overlaps and touching ranges). This puts the old sort back so a device loss can be tested with and without it (Full path: Advanced > Troubleshooting > Old sort for captured uniform ranges (test)).
tradeoff = About 2 ms more on the game thread per submit with many ranges.

[TOTK_EXCL_CLEAR]
name = Clear the exclusive monitor at a core switch
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = When a game thread gives up its virtual core, cancel its pending load-exclusive, as the Switch does (0122). Leave this on.
detail = Off puts back the behaviour before 0122 for a crash test: a store-exclusive after a core switch can then succeed on a value that changed and changed back (the lock-free list corruption suspected in the 2026-10-30 21:08 crash) (Full path: Advanced > Troubleshooting > Clear the exclusive monitor at a core switch).
tradeoff = Off: the rare list corruption of 2026-10-30 can come back.

[TOTK_VK_ROBUST]
name = Bounds-checked GPU reads
tab = advanced
group = Troubleshooting
type = bool
default = off
on = 1
off = -
summary = Another "device lost" check: if crashes stop with this on, an out-of-range read was the cause.
detail = Asks the driver to bounds-check buffer reads instead of faulting.
tradeoff = Slower.
recommended = -

[TOTK_VK_VALIDATION]
name = Vulkan validation layer
tab = advanced
group = Troubleshooting
type = bool
default = off
on = 1
off = -
summary = Log Vulkan API misuse. Needs the Vulkan SDK installed.
detail = Loads the Khronos validation layer from the Vulkan SDK. Without the SDK this does nothing useful.
tradeoff = Much slower.

[TOTK_CRASH_PDB]
name = Function names in crash reports
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = When the game crashes, the report names the host function at each address from UltraInstinctTears.pdb.
detail = On a crash the report looks up every host address (the crashing instruction, the call chain and the stack words) in UltraInstinctTears.pdb next to the exe, using Windows' own dbghelp.dll, and shows the function name, offset, source file and line. It reads only the PDB that setup.py built; nothing is sent anywhere. Turn it off only if the crash report itself hangs or crashes.
tradeoff = None while playing; loading the PDB takes a moment, and only after a crash.

[TOTK_LIFT_PROBE]
name = Shadow-size check
tab = advanced
group = Troubleshooting
type = bool
default = on
on = -
off = 0
summary = Lets the game confirm where it sets its shadow size, so Shadow resolution can be turned on after the next setup.
detail = Only does anything when the build-time scan found more than one place that could set the shadow-map size. Each one then notes the size it passes, and the place whose size the game then gives to a new shadow map gets the credit. When exactly one place stands out, the game writes diag/lift-confirm.txt and stops checking; run tools/setup.py again and Graphics > Detail and pop-in > Shadow resolution can be used. Nothing in the game is changed while checking. diag/lift-probe.txt lists every candidate (the problem report includes both files).
tradeoff = None worth noting: a counter at a few places that run when the shadow settings are made.

[TOTK_DIAG_ENV_ONCE]
name = Log diagnostic settings once
tab = advanced
group = Troubleshooting
type = text
default = -
hint = 1
summary = Print the diagnostic environment once at start-up (development).
detail = Developer diagnostic; leave empty.
tradeoff = More log output.

[TOTK_HEAP_EXTRA_MB]
name = Extra texture heap memory (test)
tab = advanced
group = Troubleshooting
type = choice
default = -
choices = -:None|811:+811 MiB (what a 4K output adds)|256:+256 MiB
summary = Give the game's texture heaps more memory without changing the output resolution. Only for testing the floating ground.
detail = A larger Output resolution grows the game's texture heaps and application memory (the log's "texture heaps +811 MiB" at 4K), which moves where the game places its terrain tiles in memory. This adds the same memory at the 1080p output, so a run with Output resolution at 1920 x 1080 and this at +811 MiB shows whether the floating ground follows the memory layout (it appears) or the bigger picture (it does not). The log says "texture heaps +... MiB more (TOTK_HEAP_EXTRA_MB)".
tradeoff = Uses that much more memory. Leave it at None for play.

[TOTK_TIMER_EXACT]
name = Exact timer division (old way)
tab = advanced
group = Speed changes: fall back+
type = bool
default = off
on = 1
off = -
summary = Go back to the old, slower way of reading the clock. Only for testing.
detail = The game reads the clock very often. The port used to turn the PC's counter into nanoseconds and Switch ticks with a slow 128-bit division on every read. It now multiplies by a number worked out once at start, which gives the same time (at most one nanosecond or one tick lower, never going backwards; a box test checks this). Turn this on only if you suspect the clock: it brings the division back.
tradeoff = On costs a little CPU time on every clock read (about 5% of the game's CPU samples in another port's measurement).

# ---------------------------------------------------------------- Advanced: updates and reports

[TOTK_LAUNCHER_UPDATE_DIRS]
name = Folders with update packages
tab = advanced
group = Updates and reports
type = text
applies = launcher
default = -
hint = Folders separated by ; for example D:\Downloads;E:\Packages
summary = Where About > Install update looks for UltraInstinctTears-src*.zip packages, besides the game folder and the folder above it.
detail = Install update picks the newest package it finds in these folders; you can always choose a zip yourself instead. These are read as well as (and whenever GitHub cannot be reached, instead of) the GitHub check of Check GitHub for updates.
tradeoff = None.

[TOTK_LAUNCHER_UPDATE_ONLINE]
name = Check GitHub for updates
tab = advanced
group = Updates and reports
type = bool
applies = launcher
default = on
on = -
off = 0
summary = About > Install update also asks GitHub for the newest release, shows what is new and downloads it when you choose Install.
detail = When you press Install update, and (with Check for updates when the launcher starts on) once in the background each time the launcher opens. Never while the game runs: nothing touches the network during play. The download is checked (its size and the SHA-256 the release publishes) and then installed exactly like a zip you choose yourself, with the same backup and rollback. No account is needed. When GitHub cannot be reached (offline, the repository not public yet, the hourly limit of checks), Install update says why and goes on with the local zips. Off: only local zips, no network at all.
tradeoff = None for the game. Each check is one small request to api.github.com; a download is the size of the source package.

[TOTK_LAUNCHER_UPDATE_ON_START]
name = Check for updates when the launcher starts
tab = advanced
group = Updates and reports
type = bool
applies = launcher
default = on
on = -
off = 0
needs = TOTK_LAUNCHER_UPDATE_ONLINE=-
summary = Each time the launcher opens it asks GitHub once, in the background, whether there is a newer release. If there is, About gets a dot and the bottom line says so.
detail = A few seconds after the launcher opens, one small request to GitHub, in a separate helper process, with a short time limit. It never holds up the launcher, the controller or Play, and it never runs while the game does: press Play while it is still asking and it is stopped (it asks again once, after the game closes). Offline, the hourly limit or any other error: nothing is shown, the reason goes in logs\update-check.txt. A newer release only shows a notice (a dot on About and "Update available: v1.x.y - About > Install update" at the bottom); nothing is downloaded until you press About > Install update. Include pre-releases counts here too. Not after the launcher restarts itself to finish an update. Needs Check GitHub for updates on.
tradeoff = None for the game. One small request to api.github.com per launcher start.

[TOTK_LAUNCHER_UPDATE_PRERELEASE]
name = Include pre-releases
tab = advanced
group = Updates and reports
type = bool
applies = launcher
default = off
on = 1
off = -
needs = TOTK_LAUNCHER_UPDATE_ONLINE=-
summary = Also offer GitHub releases marked as pre-release (test builds before a release).
detail = Off: only full releases are offered. On: the newest release by version number, pre-release or not (drafts never). A pre-release is tagged like v1.1.0-rc1 and counts as older than v1.1.0 itself, so turning this off again later moves you on to the release when it comes out.
tradeoff = Pre-releases are less tested than releases.

[TOTK_LAUNCHER_UPDATE_REPO]
name = GitHub repository for updates
tab = advanced
group = Updates and reports
type = text
applies = launcher
default = -
hint = owner/name; empty = SuperSenad/Ultra-Instinct-Tears
needs = TOTK_LAUNCHER_UPDATE_ONLINE=-
summary = Which GitHub repository Install update checks for releases.
detail = Leave it empty for the official one. A fork's owner/name to test its releases. For a private repository (testing only), put an access token with read access in the environment variable UIT_GITHUB_TOKEN or in updates\github-token.txt in the game folder; it is never written to this settings file, to logs or to problem reports.
tradeoff = None.

[TOTK_LAUNCHER_REPORT_DIR]
name = Folder for problem reports
tab = advanced
group = Updates and reports
type = text
applies = launcher
default = -
hint = A folder; empty = your Desktop
summary = Where About > Report a problem saves its zip.
detail = The report holds the two newest game logs, the newest update log, your settings file, the version and any crash files. Nothing is sent anywhere; attach the zip yourself.
tradeoff = None.

[TOTK_LAUNCHER_PYTHON]
name = Python command
tab = advanced
group = Updates and reports
type = text
applies = launcher
default = -
hint = Empty = deps\python\python.exe (comes with the package), else py -3; or a full path to python.exe
summary = The Python that Install update, Report a problem and mod installs run, the same one that builds the game.
detail = Each runs a script from the tools folder with this command. Empty uses the Python that comes with the package (deps\python\python.exe), the one tools/setup.py builds with, and py -3 (the Python launcher) in a folder without it. Install update rebuilds the game with the same Python.
tradeoff = None.

# ---------------------------------------------------------------- Advanced: DLSS internals

[TOTK_DLSS_JITTER]
name = DLSS camera jitter
tab = advanced
group = DLSS internals+
type = bool
default = on
on = -
off = 0
needs = TOTK_UPSCALER=dlss
summary = Shift the scene by a fraction of a pixel each frame so DLSS can rebuild detail. Leave it on.
detail = DLSS (Graphics > Image quality > Upscaler: NVIDIA DLSS) builds its sharp picture from many slightly shifted frames; without the shift Quality, Balanced and Performance only blur-upscale. The shift is only applied on frames DLSS actually draws, so the game's own upscale never shakes (before 0160 it could, with several recording threads; if you turned this off for that, turn it back on). The log's "[totk-dlss] status:" line shows "jittered" frames while it works. Off only for an A/B comparison.
tradeoff = Off makes DLSS noticeably blurrier and more aliased, like a plain upscale.

[TOTK_DLSS_JITTER_SIGN]
name = DLSS jitter direction
tab = advanced
group = DLSS internals+
type = choice
default = -
choices = -:Normal|-1:Flipped
needs = TOTK_UPSCALER=dlss
summary = A test switch: the direction of the jitter that is reported to DLSS. Leave it at Normal.
detail = Normal reports the picture's own shift, the convention NVIDIA's DLSS and AMD's FSR 2 use. Flipped reports the opposite, only to compare: stand still in a scene with grass and distant detail and switch between the two (Advanced > DLSS internals > DLSS jitter direction, then Play again). Normal should be the sharp, steady one; Flipped shimmers, crawls a pixel and looks softer. Report it if Flipped looks better.
tradeoff = The wrong direction makes DLSS shimmer, wobble and look soft.

[TOTK_DLSS_DEBUG_MV]
name = DLSS motion debug
tab = advanced
group = DLSS internals+
type = choice
default = -
choices = -:Off|1:Log|2:Log and show motion
needs = TOTK_UPSCALER=dlss
summary = A diagnostic for DLSS shake or smearing in motion; Log and show motion shows the motion vectors instead of the picture.
detail = The "[totk-dlss] status:" line is always written every 1800 frames while DLSS is the upscaler: draws DLSS replaced, draws it kept and why, jittered frames and the jitter DLSS is told, frames with camera motion and its size in pixels, and history resets. Log adds a "[debug-mv]" line every 300 frames: where the camera came from, resets by reason, the camera speed and the jitter. Log and show motion also replaces the DLSS picture with its motion vectors: flat yellow-grey when still; turning right makes the whole screen redder and turning left greener, moving forward spreads colour out from the centre, all smoothly. Send the log lines when reporting a DLSS problem.
tradeoff = Show motion replaces the game picture while it is on; turn it Off to play.

[TOTK_DLSS_MV_PROBE]
name = DLSS render target survey
tab = advanced
group = DLSS internals+
type = bool
default = off
on = 1
off = -
needs = TOTK_UPSCALER=dlss
summary = A diagnostic that logs the game's render targets on a few frames, to check whether the game keeps its own motion data.
detail = On frames 600 and 601 and then once a minute (8 frames in all), the log lists every set of render targets the game draws into before its upscale: formats, sizes, depth and shader key, and marks two-channel targets that could hold motion vectors. It only writes to the log; the picture and DLSS are unchanged. Use it with Play with log and send the lines that start with "mv-probe".
tradeoff = A short hitch on each surveyed frame while the lines are written.

[TOTK_DLSS_LOG]
name = DLSS logging
tab = advanced
group = DLSS internals+
type = choice
default = -
choices = -:Normal|2:Verbose
needs = TOTK_UPSCALER=dlss
summary = How much NVIDIA Streamline writes to the log. Verbose is for bug reports.
detail = Verbose makes Streamline log each step of loading and running DLSS. Use it with Play with log when DLSS does not start.
tradeoff = A larger log and a little overhead.

# ---------------------------------------------------------------- Advanced: compatibility switches (A/B)

[TOTK_ASYNC_REPLAY]
name = Separate GPU translation thread
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Translate the game's GPU commands on a dedicated thread.
detail = On by default: the game's thread hands submissions and presents to a translation thread, so both run in parallel. Off is the older single-thread path, for comparison.
tradeoff = Off: lower frame rate.

[TOTK_COPY_TOKEN]
name = Copy tokens
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = A rendering correctness switch. Leave on unless asked to test.
detail = Controls how recorded texture copies are tracked when the separate translation thread is off. A/B switch for developers.
tradeoff = Off may cause rendering errors.

[TOTK_PIN_SWEEP]
name = Pin sweep
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = A rendering correctness switch. Leave on unless asked to test.
detail = Releases recorded texture copies at the right time. A/B switch for developers.
tradeoff = Off may cause rendering errors or memory growth.

[TOTK_VK_VIEW_KEY]
name = Image view cache fix
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Bug fix: reuse texture views instead of making new ones every draw. Leave on.
detail = A texture can be looked at in several ways ("views": one mip level, one layer, another format, as a render target, as a storage image). The port keeps the views it made so it does not create them again. Two bugs: the lookup compared bytes the game does not set (leftovers on its stack), so the same view was made again and again until a texture had 32, after which every draw made and threw away a new one (your logs show "more than 32 views" on ten textures); and a render-target view and a storage view of the same texture looked the same to the lookup, so one could be handed out for the other. With this on the lookup compares only what the view sets plus how it is used, and a texture keeps up to 480 views. Off restores the old lookup (A/B). In the log: "TOTK_VK_VIEW_KEY=1" at start, and the per-frame line "image views created" should be near 0 once a scene is loaded, with "not kept" 0.
tradeoff = None expected. Off can waste CPU time making views every frame. If something looks wrong only with this on, set it to Off and send the log.

[TOTK_DIRTY_NEW_POOL]
name = New pools count as written
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Bug fix: when the game frees a memory pool and makes a new one at the same address, textures kept from the old pool upload again. Leave on.
detail = The port keeps textures whose memory pool the game freed, so the next texture at the same address and shape can reuse them, and it re-uploads a texture only when its memory changed since the last upload. When a pool was created, the port started its pages as "never written" and threw away the writes Windows had seen there before, so data the game put there between the two pools (file reads, copies before the new pool existed) was missed and the old pool's texels were drawn. With this on a new pool's pages count as written once, so a texture kept from before uploads again; textures first made over the new pool are not affected. Off restores the old behaviour (A/B). In the log: "TOTK_DIRTY_NEW_POOL=1" at start.
tradeoff = A few extra texture uploads when a pool is replaced (about 230 pools are freed in a 30-minute session). If something looks wrong only with this on, set it to Off and send the log.

[TOTK_VK_SAMPLER_FREE]
name = Free one-use samplers
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Bug fix: a texture sampler made while the game was changing it is freed after use instead of leaked. Leave on.
detail = A sampler (how a texture is filtered and wrapped) is made the first time a draw needs it and kept for the next draws. If the game re-registered that sampler while it was being made, the new one could not be kept and was never destroyed: a small GPU object leak each time (drivers allow a few thousand samplers). With this on it is used for that draw and destroyed after the submission that draws with it, like replaced samplers already are. Off restores the old behaviour (A/B). In the log: "TOTK_VK_SAMPLER_FREE=1", and "samplers made while the game re-registered them" when it happens.
tradeoff = None expected. If something looks wrong only with this on, set it to Off and send the log.

[TOTK_VK_LINE_WIDTH]
name = Game's line width
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Draw lines as wide as the game asks (it asks for 4.5 pixels) instead of 1 pixel. Leave on.
detail = The game draws some things as lines (a few line-strip draws a frame in the frame captures) and sets their width to 4.5 pixels. The layer this port came from could only draw 1-pixel lines, so they came out thin or broken up. With this on the width the game sets is used, within what the GPU allows (RTX cards: up to 64). Off draws 1-pixel lines as before (A/B). In the log: "TOTK_VK_LINE_WIDTH=1" with the GPU's range.
tradeoff = None expected; triangles are not affected. If lines look wrong only with this on, set it to Off and send the log.

[TOTK_VK_POLY_OFFSET_MODE]
name = Depth bias by polygon mode
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = Bug fix: the game's depth bias (polygon offset) follows the polygon mode it is set for. Leave on.
detail = The game can turn polygon offset on separately for triangles drawn filled, as lines or as points. The port always looked at the "filled" switch, so triangles drawn as lines or points used the wrong one. Filled triangles (nearly every draw) are not changed. Off restores the old behaviour (A/B). In the log: "TOTK_VK_POLY_OFFSET_MODE=1" at start.
tradeoff = None expected. If something looks wrong only with this on, set it to Off and send the log.

[TOTK_VK_PROVOKING_LAST]
name = Flat shading from the last vertex
tab = advanced
group = Compatibility switches+
type = bool
default = off
on = 1
off = -
summary = Experiment: take flat-shaded values from each triangle's last vertex, as the Switch does. Off = first vertex (as before).
detail = The Switch's graphics API uses the last vertex of each triangle for values that are not blended across it; Vulkan uses the first unless told otherwise. It is not known whether any TOTK shader depends on this, so it is off until tested. If on and the GPU cannot do it, the log says so and nothing changes. In the log: "TOTK_VK_PROVOKING_LAST=1".
tradeoff = None for speed. Try it if some surfaces show blocky or wrong-coloured faces; compare On and Off.


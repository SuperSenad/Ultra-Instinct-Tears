[TOTK_PROF_GAME]
name = Find the slowest code (CPU profiler)
tab = advanced
group = Developer: profiling+
type = bool
default = off
on = 1
off = -
summary = Sample where the CPU time goes for the whole session and write the top functions to the log.
detail = Starts 30 seconds after launch and samples every thread about 1000 times a second until the game closes. Every 5 minutes it writes the slowest functions so far into the log ([prof] lines: the share in recompiled game code, the runtime and renderer, and the GPU driver; the top 25 functions; the game's main thread's top 15) and a full report to diag\profile.txt in the game folder (its full path is in the log). Recompiled functions are named f_<Switch address>, with the game's symbol when there is one. Send the [prof] lines (or the report) when reporting performance. Advanced > Developer: profiling+ > CPU profiler, when set, takes precedence (its own start and length).
tradeoff = About 1% slower while on; each report pauses sampling for under a second. Off by default.


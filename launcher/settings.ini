[TOTK_OVERLAY]
name = In-game overlay
tab = game
group = In-game overlay
type = bool
default = on
on = -
off = 0
summary = A settings panel over the game: press F1 (the key below) or hold both stick buttons for a second.
detail = Changes the settings that take effect while you play (FSR 1 and sharpening, fullscreen and window size, present mode, the frame rate target between 60 and 120, frame pacing, texture streaming, volume, vibration and gyro) and saves them here, so the launcher shows the same values. Works with the mouse and keyboard (arrows, Enter, Esc) and the controller (D-pad or stick, A, B, LB / RB). While it is open the game gets no input. Settings the game reads only at start are not in it.
tradeoff = None: while closed it costs nothing measurable; open, one small draw after the upscaler.
tip = In game: F1 (or the key below) opens and closes it; hold L3 + R3 for a second on a controller.

[TOTK_OVERLAY_KEY]
name = Overlay key
tab = game
group = In-game overlay
type = choice
default = -
choices = -:F1|F2:F2|F3:F3|F4:F4|F5:F5|F6:F6|F12:F12|Insert:Insert|Home:Home|End:End|PageUp:Page Up|PageDown:Page Down|Pause:Pause
needs = TOTK_OVERLAY=-
summary = The key that opens and closes the overlay.
detail = None of these is a game key; F7 to F11 stay the in-game hotkeys (mark, FSR, sharpening, DLSS, fullscreen). If you bound the same key to a Switch button under Keyboard keys, the overlay takes it.
tradeoff = None.

[TOTK_OVERLAY_PAD]
name = Overlay controller combo
tab = game
group = In-game overlay
type = choice
default = -
choices = -:L3 + R3 (both stick clicks)|guide:Guide / PS / Home button (hold)|leftstick+rightstick,guide:L3 + R3 or the Guide / PS / Home button|misc1:Share / Capture button|touchpad:Touchpad press (PlayStation)|none:None (keyboard only)
needs = TOTK_OVERLAY=-
summary = What you hold on the controller to open and close the overlay.
detail = Game > In-game overlay > Overlay controller combo, saved as TOTK_OVERLAY_PAD in ultrainstincttears.cfg next to UltraInstinctTears.exe. Held for the time below (Controller hold time, about 1 s). Both stick clicks together are never used by the game (L3 crouches, R3 aims the scope), and pressing any other button while holding cancels it, so it does not open by accident. A ring fills while you hold. The Guide choices use the middle button: Xbox on Xbox pads, PS on PlayStation pads, Home on Switch pads; the game never sees it while it opens the overlay.
tradeoff = The first stick click still reaches the game until the second one joins it. Windows may also act on the Guide button: Xbox Game Bar opens on it unless you turn off Settings > Gaming > Xbox Game Bar > "Open Xbox Game Bar using this button on a controller" (newer Windows 11: Gaming > Game Bar > "Allow your controller to open Game Bar"). Steam (Big Picture or Steam Input) and DS4Windows can take the button too: turn off their Guide shortcut, or pick L3 + R3.


[TOTK_STICK_DEADZONE_L]
name = Left stick deadzone
tab = game
group = Controller
type = int
applies = live
default = 0
min = 0
max = 50
step = 1
unit = %
zero = Off (as before)
summary = Ignore small movements of the left stick near the centre, so a worn stick stops walking Link on its own.
detail = A radial deadzone: anything closer to the centre than this share of the stick's travel reads as centred, and the rest is stretched so movement still starts smoothly from zero and still reaches full speed at the edge. Off sends the stick exactly as before. The in-game overlay changes it while you play.
tradeoff = Higher values stop drift but need a bigger push before Link starts to move; try 5 to 10 % for a drifting stick.
tip = In game, change it from the overlay (Game tab) and feel the difference at once.

[TOTK_STICK_DEADZONE_R]

detail = The terrain tiles the GPU draws (260x260) are also read through textures of other formats over the same memory. Those are uploaded from game memory, which held the GPU's drawing only after the CPU read it, and never later drawings. With this on, such an image is copied back after every drawing and the other textures upload again (needs Refresh GPU-drawn textures on). The log's [alias] lines say which images it applies to (Full path: Performance > Stutter > Textures+ > Keep memory other textures read current).

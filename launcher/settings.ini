[TOTK_UI_CONFIRM]
name = Confirm button (menus)
tab = game
group = Controller
type = choice
default = -
ask = 1
choices = standard:Standard (bottom button)|game:Follow the game (right button)
summary = Which controller button confirms in the launcher's menus and the in-game overlay: the bottom one (Standard) or the right one, as in the game.
detail = Game > Controller > Confirm button (menus), saved as TOTK_UI_CONFIRM in ultrainstincttears.cfg next to UltraInstinctTears.exe. Standard: the bottom face button (A on Xbox, Cross on PlayStation) confirms and the right one (B, Circle) goes back. Follow the game: the right face button confirms and the bottom one goes back, like the Switch and the game itself (B on Xbox, Circle on PlayStation, A on a Switch controller). It applies to everything in this launcher (lists, dialogs, the search keyboard, the button hints at the bottom) and to the in-game overlay. It does not change the game's own buttons: those are under Controller buttons below. The launcher asks the first time it opens; change it here any time.
tradeoff = None. The overlay picks the change up the next time you press Play.
tip = Buttons count by position, not by the letter printed on them: on a Switch Pro controller Standard confirms with B (the bottom button).


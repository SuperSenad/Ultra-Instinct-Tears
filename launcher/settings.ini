[TOTK_GEO_SNAPSHOT]
name = Vertex data snapshots
tab = advanced
group = Compatibility switches+
type = choice
default = -
choices = -:Recently written (default)|2:All small ranges|0:Off
summary = Capture vertex and index data the game rewrites at submit time. Fixes exploded, spiky polygons.
detail = Like the uniform snapshots: vertex and index ranges the game's CPU rewrote recently are copied when a frame is handed over, so the GPU never draws them with the next frame's bytes. All small ranges copies every range up to 1 MiB (diagnostic, more CPU time). Off reads live memory as before patch 0018.
tradeoff = Off can show giant spiky polygons; All costs more CPU time on the game thread.

[TOTK_GEO_GPU_KEEP]
name = Vertex data the GPU wrote
tab = advanced
group = Compatibility switches+
type = choice
default = -
choices = -:Never copied (default)|600:Copied again after 600 submissions (0027-0037)
summary = Vertex and index data the GPU has written is always read from memory, never from a snapshot. Fixes grass vanishing shortly after loading.
detail = Patches 0027-0037 stopped treating such data as the GPU's 600 submissions (10-20 s) after the GPU wrote it, so a snapshot of game memory, which may lack the GPU's bytes, was drawn instead from then on: grass turned to bare dirt a little after loading in. The per-frame log line "vertex / index ranges ... read from memory as GPU-written" counts these ranges.
tradeoff = The 0027-0037 choice is for comparison only. Never copied may let a range the GPU wrote once and the CPU rewrites later show spiky polygons; if that happens, report it.

[TOTK_VK_POOL_SHADOW]
name = GPU-side game memory copy
tab = advanced
group = Compatibility switches+
type = choice
default = -
choices = -:Auto (on for dedicated GPUs)|1:On|0:Off
summary = Keep a copy of game memory on the graphics card's own memory.
detail = Dedicated GPUs reach system memory over PCIe; the copy avoids that. Auto turns it on for dedicated GPUs. Off on a dedicated GPU is for testing only: every draw then reads its vertices and uniforms across PCIe.
tradeoff = Uses more video memory. Off on a dedicated GPU costs a lot of frame rate (RTX 3080 Ti: GPU 25-38 ms a frame instead of ~6, about 25 fps).


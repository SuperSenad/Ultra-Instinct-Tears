[TOTK_VK_SBUF_PTR_SIZE]
name = Sane sizes for storage buffers behind uniform-buffer pointers
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = Bind a storage buffer the shader reaches through a uniform-buffer pointer over the memory that really exists: a size that runs past the end of game memory is cut to what is there, and a size of 0 gets the memory after the address.
detail = Only the driver's storage buffer table is sure to hold a size after each address. For a pointer in another uniform buffer (c6 in the Depths) the size can be 0 or run past the end of the memory pool, which bound an empty buffer (every read 0). With this on, such a buffer is bound over what the pool holds (at most 1 MiB for a size of 0). A size that fits is kept, however large: the Depths' ground data behind c6 is about 258 MiB, and 0331's 1 MiB cut made the ground lose vertices (fixed in 0333). The log says "storage buffer through c6+... bytes bound" for the first few.
tradeoff = None expected. Off: the size is used as it is (as before 0331), for comparison.

[TOTK_VK_GPU_MEM_COHERENT]
name = Keep game memory current with what the GPU drew
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = When the game lets go of a GPU-drawn image, or reads its memory as a buffer (vertex, index, uniform or storage data), copy the GPU's last drawing into game memory first, as the Switch's shared memory would hold it. Aimed at the floating ground.
detail = The port keeps GPU drawings in the graphics card's own images; game memory gets them only when copied back. When the game lets a drawn terrain tile go and places a new texture or buffer over the same memory, that reader got what memory held before the GPU drew. With this on, a released drawn image (up to 1 MiB) is copied back at the end of the submission that drew it, a buffer read over a drawn image marks it to be copied back after each drawing, and copied-back bytes also go into the card's copy of the memory pool (what buffers are read from). Includes "Keep memory current after a texture is let go (test)". The log says "[alias] GPU drawings copied back ...: on", and "[alias] buffer ..." lines name any buffer read over a drawing (logged with this off too).
tradeoff = A small copy (about 210 KiB per terrain tile) when the game lets a drawn tile go, and after each drawing of an image read as a buffer. A reader in the very submission that drew the image sees the drawing one submission later. Off: as before 0155, for comparison.

[TOTK_VK_REG_AS_OF_SUBMIT]
name = Textures as registered when the frame was submitted
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = Draw each submission with the textures the game had registered when it submitted it, not ones it registered afterwards. Aimed at ground patches drawn where there is no ground (no collision).
detail = The game registers textures in its texture pool from several threads while the translation thread replays submissions a few frames behind. A slot registered again in that window (terrain height tiles are, as the tile cache moves) gave a draw the new tile while its placement was still the old one, so terrain from elsewhere appeared in the wrong spot. With this on, each registration is numbered and a submission reads every slot as it was at its submit call (the last 8 versions of a slot are kept). The log counts these ("[draws]   texture slots registered again between the submit call and its replay") and names the first ones ("[UIT 0156] texture slot ..."), with this off too.
tradeoff = A little memory for slots registered more than once. Off: the newest registration, as before 0156, for comparison.

[TOTK_VK_PRIM_RESTART]
name = Split triangle strips where the game splits them
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = Draw the game's triangle strips with primitive restart, as the Switch does: each strip stops at the marker index instead of joining the next one. Fixes the floating ground (flat terrain slabs in the air or over water that you can walk through).
detail = TOTK draws its terrain patches (and many other meshes) as 16-bit triangle strips separated by the marker index 0xFFFF, and turns primitive restart on so the GPU starts a new strip there. Before 0158 the Vulkan replay never turned restart on, so the marker was drawn as a real vertex and every strip was joined to the next through it: long flat triangles across each terrain patch, textured like the ground, with no collision. With this on, strips and fans follow the game's own setting (on until the game sets it). The log says "[UIT 0158] the game sets primitive restart on, index 0xffff" and "[UIT 0158] strips and fans restart at the all-ones index", and a frame capture prints "primitive restart on" under each strip draw. In ultrainstincttears.cfg, TOTK_VK_PRIM_RESTART=strips restarts every strip whatever the game set.
tradeoff = None expected: this is what the game asks for. Off: as before 0158, for comparison only (the floating ground comes back).

[TOTK_VK_UCAP_FINE]
name = Drop only what the GPU wrote from the frame's uniform copy
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = When the GPU writes into memory the frame's copy of the game's constants covers, stop using only the written bytes of the copy, and with one recording thread write the same update into the copy. Aimed at ground patches drawn in the wrong place (no collision).
detail = Each submission's uniform, vertex and index data is copied at the game's submit call, merged into ranges of up to a few MiB. Before 0157 any GPU write into a range (an inline update, a buffer copy, a store), or for vertex and index data any GPU write there ever, sent every binding in the whole range to game memory, which by the time the replay draws holds what the game wrote for a later frame: a draw got another frame's placement. With this on only bindings that overlap the written bytes read memory, and inline updates and copies recorded on the single recording thread go into the copy as well. The log line "[UIT 0157] GPU writes into the copy" counts it.
tradeoff = None expected. Off: the whole range is dropped, as in 0156, for comparison.

[TOTK_VK_UCAP_GPUVIEW]
name = Fix Depths ground (read per-draw buffer pointers)
tab = performance
section = Stutter
group = Textures+
type = bool
default = on
on = -
off = 0
summary = When the game rewrites a uniform buffer between draws from the command buffer, the storage buffer behind a pointer in it is bound from that draw's bytes, not from the frame's start. Aimed at the Depths: missing ground, spikes and stretched faces.
detail = The Depths' ground shaders find their vertex data through an {address, size} pair in c6, and the game rewrites those 48 bytes with an inline update or a buffer copy before every ground draw. The GPU sees each draw's pair, but the replay read the pair on the CPU from the frame's uniform copy (or game memory), which hold the pair from before the first update: every ground draw was bound the vertex data of another draw, so the terrain mesh vanished, Gloom patches and cliffs threw spikes and walls smeared. With this on, inline updates and buffer copies (up to 16 KiB each) are kept with their position in the submission, and a CPU read of uniform memory lays the bytes written before its position over the copy. The log says "[UIT 0335] pointers read from uniform memory see the GPU's earlier writes" at start and "[UIT 0335] uniform memory ... read by the CPU at position ..." the first times it changes a read.
tradeoff = None expected: a few KiB a frame. Off: pointers read as of the submit call, as before 0335, for comparison only (the Depths ground goes missing).

[TOTK_VK_UCAP_VERIFY]
name = Check uniforms read from memory against the frame's copy
tab = performance
section = Stutter
group = Textures+
type = bool
default = off
on = 1
off = -
summary = Count, per frame, the constant buffers a draw read from game memory instead of the copy taken at the submit call, and log the first ones whose memory no longer holds what was submitted.
detail = Diagnostics: the line "per frame: [UIT 0157] uniform bindings" splits every uniform binding by where it was read from; "differing from the copy outside the GPU's bytes" counts bindings that read game memory changed since the submit call (another frame's values). The first 24 are named in the log ("[UIT 0157] a uniform buffer read from memory differs ...").
tradeoff = A lookup per uniform binding (about 19,000 a frame) and a memory compare per binding read from memory: diagnostics only, off by default since 0158 (it never found a differing binding). Off: no check, and no "[UIT 0157] uniform bindings" line.

[TOTK_VK_ALIAS_RELEASED]
name = Keep memory current after a texture is let go (test)
tab = performance
section = Stutter
group = Textures+
type = bool
default = off
on = 1
off = -
needs = TOTK_VK_ALIAS_COPYBACK=-
summary = Also copy back a GPU-drawn terrain tile the game has already let go when another texture reads its memory. Aimed at the floating ground.
detail = "Keep memory other textures read current" only copies back tiles the game still holds. In the cc3add4 field log every texture that read a GPU-drawn tile's memory read a tile the game had already let go ("writer: released" in the [alias] lines), so the reader got whatever was in memory before the GPU drew there. With this on, that tile's last drawing is copied back at the next submission and the reader uploads again (needs Refresh GPU-drawn textures on). The log says "released GPU-drawn images ... are copied back too".
tradeoff = New (off until tested): a small copy (about 210 KiB per tile) when it happens. If another texture drew over the same memory later without being copied back, the older drawing can land on top of it.

[TOTK_VK_SUBALLOC]
name = Shared texture memory blocks
tab = performance
section = Stutter
group = Video memory+
type = bool
default = off
on = 1
off = -
summary = Put textures into large shared blocks of video memory instead of asking the driver for memory once per texture.
detail = Each new texture used to make its own request to the graphics driver, and a request that needs a fresh block from the driver can take 8 to 19 ms on the render thread (a visible hitch). With this on, the port's own memory suballocator hands out places in big blocks, so most textures need no driver request at all. Very large textures, or ones the driver wants alone, still get their own memory. If anything goes wrong while setting it up, the port falls back to the old way and says so in the log. Images the game draws into (render targets, depth, shadow maps) keep memory of their own (see Shared blocks for render targets too).
tradeoff = Off by default until it has been tested on a real GPU: a mistake here shows as wrong or missing textures or a crash when memory is released. The first play with it on (2026-10-30, before render targets were kept out of the blocks) showed floating patches of ground; if you see anything like that again, turn this off and send the log. Uses a little more video memory (free space inside blocks).


[TOTK_VK_SUBALLOC_TARGETS]
name = Shared blocks for render targets too (test)
tab = performance
section = Stutter
group = Video memory+
type = bool
default = off
on = 1
off = -
summary = With shared texture memory blocks on, also put the images the game draws into (render targets, depth and shadow maps, compute outputs) into the shared blocks. Leave this off.
detail = Images the game draws into are often drawn over only in part, and whatever is not drawn over keeps the memory's earlier contents. Memory of their own starts out empty (zeros), as it always did before shared blocks; a recycled place in a shared block still holds the bytes of whatever texture was there before. In the first play with shared blocks on (2026-10-30), patches of ground and grass floated in bands above the real terrain (which Link walked through), suspected to be exactly that (not yet confirmed). Since then these images keep memory of their own even with shared blocks on; the textures read from the game (most of the video memory) still share blocks. On: every image may share a block, as in the first version, only to test whether the floating ground comes back.
tradeoff = On may bring back floating or wrong ground. Only does anything with Shared texture memory blocks on.
[TOTK_VRAM_HEADROOM]
name = Make the next memory block ahead
tab = performance
section = Stutter
group = Video memory+
type = bool
default = on
on = -
off = 0
needs = TOTK_VK_SUBALLOC=1
summary = With shared texture memory on, a background thread prepares the next memory block before the game needs it.
detail = Only does something when "Shared texture memory blocks" is on. When a block is getting full, a background thread asks the driver for the next one, so the render thread does not have to wait for it. It stops making blocks ahead once video memory use (plus two blocks) would pass 85% of what the driver says the game may use, and gives back the spare it holds.
tradeoff = Holds back up to half a block (usually 128 MiB) per kind of memory in use. Off: new blocks are made on the render thread when needed (a hitch each time).

[TOTK_VK_STAGING_POOL]
name = Upload memory made ahead
tab = performance
section = Stutter
group = Video memory+
type = bool
default = on
on = -
off = 0
summary = Keep two 64 MiB upload buffers ready, made on a background thread, so the render thread does not allocate them.
detail = The port copies texture and buffer data to the GPU through 64 MiB upload buffers. Each time it needs one more, it used to allocate it on the render thread, many times in the first minutes of play. With this on, two are made from start-up on a background thread and refilled when one is taken. It stops making them while video memory use would pass 85% of the budget. The buffers are made exactly the same way as before.
tradeoff = Uses 128 MiB more memory (video memory on GPUs with Resizable BAR, else system memory) from start-up. Off: the old way.

[TOTK_TEX_RELEASE_SPREAD]
name = Spread texture clean-up
tab = performance
section = Stutter
group = Video memory+
type = bool
default = on
on = -
off = 0
summary = Free unused textures a few at a time instead of hundreds at once after a scene change.
detail = Textures the game stops using are kept for about two seconds (120 frames) in case it wants them back. Before, up to 512 were kept, and all the old ones were destroyed in one go, which after a scene change could be hundreds at once (a hitch). With this on up to 2048 are kept, and old ones are freed at most two per texture release, so the work is spread over many frames.
tradeoff = Keeps more unused textures in video memory for a while (more video memory used, up to 2048 textures). Off: the old 512 limit and all-at-once clean-up.

[TOTK_BC7]
name = Compressed texture cache (BC7)
tab = performance
section = Stutter
group = Texture cache+
type = bool
default = on
on = -
off = 0
summary = Use the BC7 cache that setup built from your game files instead of decoding textures live.
detail = The Switch's textures are ASTC, which PC GPUs cannot read. Setup re-encodes them once into BC7. Off decodes them to uncompressed RGBA each time instead.
tradeoff = Off uses about four times the video memory and decodes on the fly (slower, more hitches).

[TOTK_BC7_QUALITY]
name = Background encoding quality
tab = performance
section = Stutter
group = Texture cache+
type = int
default = 0
min = 0
max = 4
step = 1
needs = TOTK_BC7=-
summary = Quality of textures encoded during play that the cache did not contain yet.
detail = Rarely matters: setup encodes nearly all textures ahead of time. Anything missing is encoded in the background during play at this level and saved for next time.
tradeoff = Higher levels look marginally better but one large texture can take most of a second to encode.

[TOTK_VK_PRESYNC_SUBS]
name = Pool copies prepared ahead
tab = performance
section = Stutter
group = Memory copies+
type = int
default = -
auto = Auto (2)
min = 1
max = 16
step = 1
unit = submissions
summary = How far back the game looks when it refreshes the GPU's copies of game memory at the start of each GPU submission.
detail = Copies of memory pools used in this many recent submissions are refreshed together at the start, instead of one by one when a draw first needs them (which makes the draw wait). The per-frame log line "pools brought up to date at a submission's start ..., later from draws ..." shows the split: raising this should move work from the second number to the first.
tradeoff = Higher refreshes pools that may not be needed this time (more copying at the start of each submission). Results stay the same: only the timing changes.

[TOTK_COPY_TOKEN_ASYNC]
name = Free old command copies with the translation thread
tab = performance
section = Stutter
group = Memory copies+
type = bool
default = off
on = 1
off = -
needs = TOTK_ASYNC_REPLAY=-,1
summary = Frees the game's old recorded command lists while you play, so memory and the clean-up pass stop growing.
detail = The game records lists of GPU commands and the port keeps a copy of each one. With the separate translation thread on (the default), the copies were only freed when the game reused the exact same memory, so they piled up: the 86-minute log went from 12.9 MiB to 109.6 MiB and almost 350,000 copies, and every copy is walked again by a background clean-up pass that runs while the game draws. With this on, each copy is marked in the game's memory (as already happens without the translation thread) and freed once the game has overwritten the mark and no submission waiting on the translation thread still needs it. The log line "recording copies: ..." shows the live count; it should now level off instead of climbing. The words "kept for a queued submission" in it count copies that were held back for a moment because a waiting submission still needs them.
tradeoff = New (off until tested): a mistake here could free a copy too early and crash the game ("command handle ... is not a live recording"). Turn it off again if that message appears in the log.

[TOTK_ZSTD_NATIVE]
name = Faster file unpacking
tab = performance
section = Stutter
group = Loading+
type = bool
default = off
on = 1
off = -
summary = Unpack the game's compressed files (zstd) with the PC's own fast decoder instead of the game's converted Switch decoder.
detail = Almost every file the game reads (models, textures, maps, events) is zstd-compressed, and the game unpacks them on its loading threads with its own zstd code, converted from Switch code. With this on, seven of the game's unpacking calls (the same ones the valentderah PC port uses for 1.4.3) use the PC's libzstd instead, which produces the same bytes faster. Anything it cannot do exactly as the game would (unpacking a file over itself, a file it reports broken, a dictionary it does not recognise) goes to the game's own decoder. One caller (main+0x547a04) always keeps the game's decoder, because the game relies on that decoder rejecting some files. Big files (64 KiB and more) free the game's CPU core for other game threads while they unpack. A line "[totk] zstd: ..." in the log every 16384 files counts what went where.
tradeoff = Not yet tested in this port's game runs (the other port has it on); expected to shorten loading and the hitches when new areas stream in. If anything looks wrong (missing or broken models, textures, a crash while loading), turn it off. Off: the game's decoder, exactly as before.

[TOTK_ZSTD_CHECK]
name = Check file unpacking
tab = performance
section = Stutter
group = Loading+
type = bool
default = off
on = 1
off = -
needs = TOTK_ZSTD_NATIVE=1
summary = For testing "Faster file unpacking": unpack every file both ways, keep the game's result, and log any difference.
detail = Each file is unpacked by the PC's decoder into a buffer of its own and then by the game's decoder as usual; the game always gets its own decoder's result. Any difference (bytes, size or one of them failing) is logged as "[totk] zstd: check: DIFFERENCE ..." with the caller's address, and the summary line counts them.
tradeoff = Slower loading than either decoder alone (every file is unpacked twice). Only for checking: leave off for play.

[TOTK_LIFT_ZSTD]
name = Prepare faster file unpacking
tab = performance
section = Stutter
group = Loading+
type = bool
applies = setup
default = on
on = -
off = 0
summary = When setup converts the game's code, point the game's seven unpacking calls at the PC's decoder, so "Faster file unpacking" can be switched on. Takes effect after the next setup run.
detail = Setup changes a call only where the game's instruction is exactly the expected one (game version 1.4.3), so another version keeps its own code. With "Faster file unpacking" off, those calls go straight on to the game's own decoder (one extra function call per file, nothing else). Off converts the calls exactly as before; changing this makes the next setup run convert the code again and rebuild the game.
tradeoff = None expected with "Faster file unpacking" off. Turn off only to rule these calls out completely while looking for a problem.

[TOTK_SAVE_WRITES]
name = Save writes
tab = performance
section = Stutter
group = Saving+
type = choice
default = -
choices = -:As before|bg:In the background|safe:In the background, crash-safe
summary = How the game's save is written to disk when it saves: the game waiting for the disk, or a background thread, optionally with protection against a crash in the middle of a save.
detail = When the game saves, it writes its save files and then "commits" them. As before, the commit makes the game wait while every file it has open is flushed to the disk (files it had already closed were not flushed). "In the background" remembers which save files the game changed and flushes those, and only those, on a background thread: the game goes on at once. "In the background, crash-safe" also copies each save file to a journal (save-journal in the profile folder) before the game first changes it; if the game or the PC stops in the middle of a save, the next start puts the save from before back, as the Switch does, and moves the unfinished files to save-rolled-back in the profile folder (nothing is deleted). A log line "[totk] save: ..." shows each background flush and any restore. Closing the window waits (at most 10 s) for a flush still running.
tradeoff = Not yet tested in the game, and save data matters, so this stays "As before" until it is. Expected: no hitch when the game autosaves (the disk flush leaves the game thread). Crash-safe copies the old save files once per save (a few MB) on the game's saving thread. Not covered: the PC losing power in the few milliseconds between the commit and the end of the flush.


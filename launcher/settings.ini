[TOTK_CRITPATH]
name = What the frame waits on
tab = advanced
group = Developer: profiling+
type = bool
default = on
on = -
off = 0
summary = Log what each frame was waiting for every 300 frames: the game's own work, the translation thread or the GPU.
detail = Writes [critical path] lines to the log: the frame thread's own work and submit time, its fence waits split into waiting for the translation thread and waiting for the GPU, queue drains by cause, how busy the translation thread is and its largest single piece of work, and a verdict ("the frame waits on ..."). Lock waits summed over all threads are not frame time; these lines show which wait the frame actually sat in. Send these lines when reporting performance. [UIT 0238] A further line splits the frame thread's "own work": waiting for one of the game's 3 virtual cores, the game's own blocking waits, sleeps, polling yields, and the rest (its CPU time, and at least how long it was ready but Windows ran another thread on its CPU).
tradeoff = Negligible cost (a clock read around waits and submits). Off (0) leaves these lines out.


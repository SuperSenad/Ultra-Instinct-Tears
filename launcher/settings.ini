[TOTK_VK_SHADOW_VERIFY]
name = Check pool copies (diagnostic)
tab = advanced
group = Developer: logging+
type = choice
default = -
choices = -:Off|60:Every 60 frames|30:Every 30 frames|10:Every 10 frames
summary = Diagnostic, costs frame rate: compares the GPU's copies of game memory with the game's memory and logs any page that went stale.
detail = Every N frames, part of the GPU copies of the memory pools is read back and compared with game memory; stale pages are written to the log as [shadow verify] lines (0 is what you want). Use it once when the picture shows exploded or flickering geometry or wrong textures, then turn it off.
tradeoff = Costs frame rate (a read-back and a compare each check) and makes the log bigger. Keep it Off for play.

[TOTK_VK_OCCL_LOG_EVERY]
name = Occlusion log line
tab = advanced
group = Developer: logging+
type = choice
default = -
choices = -:Every 60 frames|300:Every 300 frames|0:Off
summary = How often the log gets the short "[occl] present N" line (grass and occlusion counters per frame).
detail = Every N frames one line: samples-passed reports and resets, conditionals turned off, draws and clears skipped or forced by "Always draw conditional draws", all draws and dispatches, and the occlusion mode. Compare the present numbers with when grass vanished to find the moment it happens.
tradeoff = About one short line a second at 60 fps (a bigger log); nothing else.

[TOTK_VK_SHADOW_VERIFY_MIB]
name = Pool copy check size
tab = advanced
group = Developer: logging+
type = int
default = -
auto = Auto (64)
min = 8
max = 1024
step = 8
unit = MiB
needs = TOTK_VK_SHADOW_VERIFY=60,30,10
summary = How much of the pool copies each check compares (diagnostic).
detail = The check walks all the pools over several checks; a bigger size covers them sooner and costs more per check.
tradeoff = Bigger costs more frame rate per check.

[TOTK_VK_POOL_GAP_OLD]
name = Old pool copy merging (0028)
tab = advanced
group = Compatibility switches+
type = bool
default = off
on = 1
off = -
summary = Development A/B switch: merge pool copy runs the 0028 way (64 KiB apart, even over GPU writes). Leave it off.
detail = 0029 stopped merging copies across GPU-written ranges that had not reached game memory yet, which caused exploded geometry. On brings the old behaviour back for comparison only.
tradeoff = On can bring the exploded geometry back.

[TOTK_VK_WB_MERGE3]
name = Merge CPU and GPU writes word by word
tab = advanced
group = Compatibility switches+
type = bool
default = on
on = -
off = 0
summary = On by default since UIT 0139 (floating / raised ground in Hyrule Field): when the game's CPU and the GPU both change the same 4 KB of memory in one frame, keep each one's changes instead of only the CPU's.
detail = With this off, such a page is left to the CPU's writes and the GPU's results in it are dropped (the log's "GPU bytes not copied back there": 600 to 1,400 bytes every frame in the 2026-10-31 field runs, in memory the game reads back). With it on, the page is snapshotted before the GPU runs and merged 4 bytes at a time: words the CPU changed stay the CPU's, words only the GPU changed take the GPU's result. The per-frame log line "three-way merge" shows the bytes recovered and the snapshot cost.
tradeoff = Costs a copy of the GPU-written memory each frame (a few MB, well under a millisecond). If the CPU rewrites a word with the exact value it already had after the GPU wrote it, the GPU's older value wins. Off (0) is the behaviour of 0137 and before, for comparison.

detail = Writes a [memory] line next to the per-frame lines: how much video memory the game uses against what the driver allows it (VK_EXT_memory_budget), the system memory the GPU uses, the game's RAM (working set and commit, with their peaks) and the free RAM of the PC. Use it to tell a stutter from running out of video memory or RAM. Only reads numbers; changes nothing.

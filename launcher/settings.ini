tradeoff = None while it is off. On: a few hundred bytes copied ten times a second, no measurable cost.

[TOTK_BENCH_SECONDS]
name = Benchmark length
tab = game
group = In-game overlay
type = int
applies = live
default = 60
min = 10
max = 300
step = 10
unit = s
summary = How long a benchmark records. Start one from the overlay's Overlay tab or with Shift+F8 while playing.
detail = A benchmark records every frame's time while you play, then writes a report to the benchmarks folder next to UltraInstinctTears.exe: a .txt with the average FPS, the 1% and 0.1% lows, percentiles, the number of frames slower than 16.7 ms and 33 ms, the build and the main performance settings, and a .csv with every frame time. Play the same route each time to compare settings. Shift+F8 again (or Stop on the overlay) ends it early.
tradeoff = Longer runs average out more, but take longer. Recording costs nothing you can measure.
tip = Shift+F8 starts and stops a benchmark in game.

[TOTK_AMIIBO_DIR]
name = Amiibo folder
tab = game
group = Amiibo
type = text
default = amiibo
hint = amiibo
summary = The folder of amiibo files the overlay's Amiibo tab lists, relative to the game folder.
detail = Put amiibo files here (.bin dumps of 540, 572 or 532 bytes, Ryujinx-style .json files or Flipper Zero .nfc files) and pick one on the overlay's Amiibo tab while playing; any other file can be chosen there with Choose a file. Only the tag's ID, serial and character are read: no keys are needed and nothing is decrypted. What the game stores on an amiibo (its application area) is kept per amiibo in the user data folder's amiibo folder, not written back to the file.
tradeoff = None. A folder that does not exist only means an empty list.
tip = Turn amiibo on in the game first (+ > System > Options). Then hold L, choose amiibo, let go of L and aim; open the overlay (F1, or hold L3 + R3), Amiibo tab, pick the file. Picked first, it waits 20 seconds for the game to ask.

[TOTK_AMIIBO_READER_MS]
name = Time on the reader
tab = game
group = Amiibo
type = int
default = 2500
min = 1000
max = 15000
step = 500
unit = ms
summary = How long a scanned amiibo stays on the virtual reader before it is taken off.
detail = On a Switch you hold the figure to the reader and take it away; here the overlay puts it on the reader and takes it off after this time. The game reads the figure as soon as it sees it, so 2.5 seconds is normally plenty. If the game sometimes says the amiibo was removed or could not be read (a slow moment, the game busy loading), raise this to 5000 or more. In the log: "taken off the reader after 2.5 s" shows the value in use.
tradeoff = Longer keeps the figure there after the game has read it; the game does not read it twice for that, but a new scan waits until it is taken off.

[TOTK_CHEAT_DURABILITY]
name = Infinite item durability
tab = game
group = Cheats
type = bool
applies = live
default = off
on = 1
off = -
lift = cheat_durability
summary = Weapons, bows and shields never wear out from use.
detail = A hit takes no durability off the item, and an item's durability reads as its maximum (worn items are repaired the next time the game reads them). A native patch of the game code (the TotK 1.4.3 instructions published in TKMM's cheat list, credits @Arch9SK7 / MyNXCheats), switched on and off while playing from the overlay's Cheats tab. Fire still burns wooden items away. Mods > Disable Mods turns every cheat off.
tradeoff = Takes the weapon economy out of the game. Saves made with it on carry repaired items.

[TOTK_CHEAT_AMIIBO]
name = Limitless amiibo scanning
tab = game
group = Cheats
type = bool
applies = live
default = off
on = 1
off = -
lift = cheat_amiibo
summary = Scan the same amiibo again the same day: the once-a-day limit is gone.
detail = The game normally refuses an amiibo already used today ("This amiibo can't be used again today"). It remembers each figure by its serial number, so with this on every scan reaches the game as a figure with a new serial number (the amiibo itself, its character and its rewards are unchanged), and the game's once-a-day check is held to the answer it gives such a figure (a native patch at the TotK 1.4.3 instruction published in TKMM's cheat list, credits @Arch9SK7 / MyNXCheats). Switched on and off while playing from the overlay's Cheats tab. Mods > Disable Mods turns every cheat off.
tradeoff = None beyond the extra drops.
tip = Each check is written to diag\amiibo.txt ("the game's once-a-day amiibo check ran ...") with the serial number the game read.

[TOTK_CHEAT_AMIIBO_BRANCH]
name = Amiibo limit patch
tab = game
group = Cheats+
type = choice
default = -
choices = -:Follow a new figure (default)|nop:Public cheat (nop)|game:New serial numbers only
needs = TOTK_CHEAT_AMIIBO=1
lift = cheat_amiibo
summary = Troubleshooting: how Limitless amiibo scanning treats the game's once-a-day check. Leave on the default.
detail = Default: the first check of the session is for a figure with a new serial number, so the game's answer then is its "not used today" answer; every later check is given that same answer. Public cheat: the branch is never taken, exactly as TKMM's cheat writes a nop there. New serial numbers only: the game decides by itself; the new serial number per scan is then the whole cheat. Only for comparing when a report shows a scan with no reward.
tradeoff = None.


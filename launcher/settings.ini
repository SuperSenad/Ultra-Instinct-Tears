[TOTK_VK_COND_DRAWS]
name = Always draw conditional draws (grass test)
tab = advanced
group = Compatibility switches+
type = choice
default = -
choices = -:Off|1:Draws only|2:Draws and clears
summary = Diagnostic only, keep Off: what the game hides with conditional rendering is done anyway (grass test). Not a grass fix; "Draws and clears" causes black flashes and cloudy floors.
detail = The game hides some draws (for example grass and foliage) behind GPU visibility tests. This port decides those tests on the CPU while it records, from values in game memory; if it reads a stale value, a whole batch of draws (or the clears before them) vanishes. Draws only: every draw a conditional turned off is drawn anyway, while clears still obey the condition. Draws and clears: clears a conditional turned off are done too. If grass stays with one of these, the conditional decision is the cause. Off-switches from SetRenderEnable(false) are always obeyed. The log line "submission N: commands so far" counts these as "draws forced by TOTK_VK_COND_DRAWS" and "clears forced"; the "[occl] present N" line every 60 frames shows them per frame.
tradeoff = Diagnostic only: more draws and clears (slower), and objects the game meant to hide may show (pop-in, doubled effects, wrongly cleared targets: with "Draws and clears" the screen can flash black when the camera moves and floors can get a cloud texture). The grass fix is "Copy GPU-drawn images back to game memory".

[TOTK_VK_IMAGE_WRITEBACK]
name = Copy GPU-drawn images back to game memory (reactive flushing)
tab = advanced
group = Compatibility switches+
type = choice
default = 1
choices = 1:Explicit reads only (default)|0:Off|2:All CPU-read targets
recommended = 1
summary = Fixes grass and foliage vanishing or popping in: images the GPU draws that the game reads back are copied into game memory, like yuzu's "reactive flushing". Keep "Explicit reads only".
detail = On the Switch the GPU draws straight into the game's memory, so the game can read what was drawn (TotK reads back some small render targets, for example for terrain and grass). Here those images live on the graphics card, and without this the game memory keeps old bytes and grass vanishes or pops in (yuzu shows the same grass pop when its "reactive flushing" is off). Only images the game can read are copied (in CPU-readable memory, no screen / depth / compressed targets), so the frame's large render targets never are. Explicit reads only (the default): when the game asks to read memory the GPU wrote (InvalidateMappedRange), the images drawn there are copied back before the game continues; in the world that is a few KiB now and then, about 0.2 ms of waiting a frame on average, with a single wait of 10-30 ms every few seconds at most, and longer once while a save loads. All CPU-read targets: also, after every submission, the small ones (up to 64 KiB) drawn in it are copied back when the GPU finishes, without waiting; not needed for the grass. Bytes the game wrote itself since the drawing are kept. The log shows "[iwb]" lines: every 60 frames the flushes per frame, KiB copied, and the wait (stall) in ms; the first copies and the first game reads over drawn images are listed one by one.
tradeoff = Explicit reads only: a short wait whenever the game reads a drawn image (watch the stall ms in the log). Off brings the grass problem back and restores the behaviour before UIT 0054 exactly. All CPU-read targets: more GPU-to-CPU copies for no known gain.

[TOTK_IWB_POOL_COPY]
name = Also refresh the GPU's copy of memory drawn images were copied back into
tab = advanced
group = Compatibility switches+
type = bool
default = off
on = 1
off = -
needs = TOTK_VK_IMAGE_WRITEBACK=-,1,2
summary = Fixes a stale copy found by "Check pool copies": after a drawn image is copied back into game memory, the graphics card's own copy of that memory gets the same bytes. New, off until tested.
detail = The port keeps a copy of the game's large memory pools on the graphics card and refreshes it from the pages the CPU wrote since the last refresh. When "Copy GPU-drawn images back to game memory" copies a drawn image into game memory, those pages are not counted as CPU writes (on purpose, so the next copy of the same image is not mistaken for the game's own writes), so the card's copy kept the old bytes. The 86-minute log showed exactly that: "Check pool copies" found the card's copy still zeros under a 260x260 image the game reads back (address 0x103ec51000), growing to 1,749 stale pages. Nothing visibly broke from it, but anything the GPU reads from that memory as plain data would get the old bytes. With this on, every copied-back image range is also copied into the card's copy at the pool's next refresh (about 210 KiB each time the game reads that image, a few times a second at most), unless the card's copy holds GPU results not yet in game memory; then it waits for the following refresh.
tradeoff = New (off until tested): a few hundred KiB more GPU copying when the game reads drawn images back; no effect on frame rate expected. To test: turn on "Check pool copies" (Advanced > Developer: logging+) too; its "stale pages" lines for 0x103ec5.... should stop. If grass or terrain look wrong with it on, turn it off again.

[TOTK_VK_OCCLUSION]
name = Occlusion test results (grass fix)
tab = advanced
group = Compatibility switches+
type = choice
default = -
choices = -:Off (fixed value, as before)|visible:Always visible (cheap fix)|gpu:Real GPU counts (faithful fix)
summary = Diagnostic: what the game's GPU visibility tests (samples passed) read back. Keep Off; the grass fix is "Copy GPU-drawn images back to game memory".
detail = The game hides objects that are behind others by drawing a test shape and reading how many pixels passed (NVN's samples-passed counter), then comparing two such counts. This port does not measure them and writes the same number every time, so a comparison of two counts says "nothing changed" and what it gates (grass, foliage) can stay hidden. Always visible writes a different, growing number each time: every test reads as visible, so nothing is occlusion-culled. Real GPU counts measures them as the Switch does (a Vulkan occlusion query around every draw after the game resets the counter), so hidden objects are still culled and visible ones drawn; the results arrive when the GPU finishes the frame's work, and until then the port draws what they gate. The log's "per frame: counter resets by type" and "off from samples-passed words" lines show how often the game uses these tests.
tradeoff = Always visible draws objects the game would have culled behind walls and hills: a little slower, never missing. Real GPU counts adds a query to most draws (a little CPU and GPU time) and depends on the port's depth buffers matching the game's; if something wrongly vanishes with it, use Always visible.

